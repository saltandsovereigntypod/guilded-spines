name: Deploy to books.saltandsovereignty.com

# Builds the standalone app (index.html, manifest, service worker, icons) and
# publishes it on GitHub Pages. The custom domain is set in the repo's
# Settings -> Pages, the same way app.saltandsovereignty.com is.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: python3 build.py

      - name: Gather what the site serves
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
          cp index.html _site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

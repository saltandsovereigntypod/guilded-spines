    var items = liveItems();
    var afterId = d.target.index > 0 && items[d.target.index - 1]
      ? itemAnchorId(items[d.target.index - 1]) : null;
    applyArrange(d.ids, afterId);
  } else {
    render();
  }
  flushRender();
}

/* ---------------- events ---------------- */
byId("tabs").addEventListener("click", function(e){
  var t = e.target.closest("[data-tab]");
  if(!t) return;
  state.tab = t.getAttribute("data-tab");
  render();
});
byId("library").addEventListener("click", function(e){
  if(state.arranging) return;
  var glay = e.target.closest("[data-glayout]");
  if(glay){ cycleLayout(glay.getAttribute("data-glayout")); return; }
  var hide = e.target.closest("[data-phide]");
  if(hide){
    state.shelfPlates.hidden[hide.getAttribute("data-phide")] = true;
    savePrefs(); render();
    return;
  }
  var plate = e.target.closest(".name-plate");
  if(plate){
    var txt = plate.querySelector(".plate-text");
    if(txt.isContentEditable) return;
    txt.contentEditable = "true";
    txt.focus();
    var r = document.createRange();
    r.selectNodeContents(txt);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
    return;
  }
  var s = e.target.closest("[data-id]");
  if(!s) return;
  var id = s.getAttribute("data-id");
  if(state.selecting){
    if(state.selection[id]) delete state.selection[id];
    else state.selection[id] = true;
    clearUndo();
    drawSelectBar();
    render();
    return;
  }
  window.__lastSpine = id;
  clearUndo();
  openBook(id, false);
});
byId("library").addEventListener("focusout", function(e){
  var txt = e.target.closest(".plate-text");
  if(!txt || !txt.isContentEditable) return;
  var key = txt.closest(".name-plate").getAttribute("data-pkey");
  var name = txt.textContent.trim();
  txt.contentEditable = "false";
  /* Empty, or the group's own name, means there is no override to keep. */
  if(!name || name === key.slice(key.indexOf(":") + 1)) delete state.shelfPlates.labels[key];
  else state.shelfPlates.labels[key] = name.slice(0, 120);
  savePrefs(); render();
});
byId("library").addEventListener("keydown", function(e){
  var txt = e.target.closest(".plate-text");
  if(!txt || !txt.isContentEditable) return;
  if(e.key === "Enter"){ e.preventDefault(); txt.blur(); }
  else if(e.key === "Escape"){ e.preventDefault(); txt.textContent = plateName(txt.closest(".name-plate").getAttribute("data-pkey")); txt.blur(); }
});
byId("library").addEventListener("pointerdown", function(e){
  if(!state.arranging || (e.button != null && e.button !== 0)) return;
  var el = e.target.closest("[data-item]");
  if(!el) return;
  endDrag(false);
  drag = {
    id: el.getAttribute("data-id"), el: el, pointerId: e.pointerId,
    capture: e.currentTarget,
    x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY,
    started: false, target: null, ids: [],
    timer: setTimeout(function(){ startDrag(); }, 180)
  };
  /* Capture on the shelf, not the book: the book can be replaced by an image
     swap or a redraw, and a capture on a detached node is a dead drag. */
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err){}
});
/* An image inside a book would otherwise start a native drag on press. */
byId("library").addEventListener("dragstart", function(e){
  if(state.arranging || state.selecting) e.preventDefault();
});
byId("library").addEventListener("pointermove", function(e){
  if(!drag || e.pointerId !== drag.pointerId) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if(!drag.started){
    if(Math.abs(e.clientX - drag.x0) > 6 || Math.abs(e.clientY - drag.y0) > 6) startDrag();
    else return;
  }
  e.preventDefault();
  moveDrag();
});
byId("library").addEventListener("pointerup", function(e){
  if(!drag || e.pointerId !== drag.pointerId) return;
  endDrag(true);
});
byId("library").addEventListener("pointercancel", function(e){
  if(!drag || e.pointerId !== drag.pointerId) return;
  endDrag(false);
});
byId("q").addEventListener("input", function(){ state.q = this.value; render(); });
byId("groupBy").addEventListener("change", function(){
  state.groupBy = this.value;
  byId("groupStyleField").hidden = state.groupBy === "none";
  updateMoveSeg();
  savePrefs(); render();
});
byId("groupStyle").addEventListener("change", function(){
  state.groupStyle = this.value;
  savePrefs(); render();
});
byId("arrangeBtn").addEventListener("click", function(){
  clearUndo();
  setArranging(!state.arranging);
});
byId("selectBtn").addEventListener("click", function(){
  clearUndo();
  setSelecting(!state.selecting);
});
byId("selectBar").addEventListener("click", function(e){
  var q = e.target.closest("[data-sel]");
  if(q){ clearUndo(); quickSelect(q.getAttribute("data-sel")); return; }
  if(e.target.closest("#bulkBtn")) openBulk();
  else if(e.target.closest("#deleteBtn")) deleteSelected();
});
byId("undoBtn").addEventListener("click", runUndo);
byId("moveSeg").addEventListener("click", function(e){
  var btn = e.target.closest("[data-move]");
  if(!btn || btn.disabled) return;
  state.moveMode = btn.getAttribute("data-move");
  updateMoveSeg();
});
byId("sortBy").addEventListener("change", function(){
  /* Seeding has to happen while the old sort is still in force — that is the
     order the reader is looking at, and the one the shelf must not jump from. */
  if(this.value === "custom"){ useCustomOrder(); render(); return; }
  state.sortBy = this.value;
  savePrefs(); render();
});
byId("dir").addEventListener("change", function(){ state.dir = this.value; savePrefs(); render(); });
byId("favOnly").addEventListener("change", function(){ state.favOnly = this.checked; render(); });
byId("platesOn").addEventListener("change", function(){
  state.shelfPlates.show = this.checked;
  savePrefs(); render();
});
byId("restorePlates").addEventListener("click", function(){
  state.shelfPlates.hidden = {};
  savePrefs(); render();
});
byId("setBtn").addEventListener("click", function(){ clearUndo(); openSettings(); });
byId("exportBtn").addEventListener("click", exportLibrary);
byId("importBtn").addEventListener("click", importLibrary);
byId("addBtn").addEventListener("click", function(){
  var id = "book-" + Date.now().toString(36) + "-" + Math.floor(Math.random()*1e4).toString(36);
  state.books[id] = {
    id:id, title:"Untitled", author:"", series:"", seriesNumber:null,
    status:"want", favorite:false, progress:0, ratings:{},
    description:"", sections:newSections(),
    display:"spine", coverId:null, addedAt:Date.now(),
    order: (list().reduce(function(m, x){ return Math.max(m, orderOf(x)); }, 0) + 100)
  };
  saveBook(state.books[id]); render(); openBook(id, true);
});
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape") return;
  if(byId("bulkOverlay")) closeBulk();
  else if(byId("setOverlay")) closeSettings();
  else if(byId("bookOverlay")) closeBook();
});

/* re-pack the shelves when the window changes width */
(function(){
  var t;
  window.addEventListener("resize", function(){
    clearTimeout(t);
    t = setTimeout(render, 180);
  });
})();

/* ---------------- motes ---------------- */
(function(){
  var m = byId("motes"), i, d;
  for(i=0;i<14;i++){
    d = document.createElement("span");
    d.className = "mote";
    d.style.left = (Math.random()*100).toFixed(2) + "%";
    d.style.bottom = "-10px";
    d.style.animationDuration = (16 + Math.random()*22).toFixed(1) + "s";
    d.style.animationDelay = (-Math.random()*30).toFixed(1) + "s";
    m.appendChild(d);
  }
})();

/* ---------------- boot ---------------- */
buildSortOptions();
updateMoveSeg();
drawSelectBar();
render();
setSave("Lighting the candles…", "off");

if(window.claude && window.claude.use){
  window.claude.use("db").then(function(store){
    if(!store){
      state.loaded = true;
      setSave("Not saving in this view", "off");
      render();
      return;
    }
    db = store;
    db.doc("settings/prefs").onSnapshot(function(snap){
      if(snap.exists){
        var d = snap.data() || {};
        if(Array.isArray(d.categories) && d.categories.length){
          state.categories = d.categories;
          buildSortOptions();
        }
        if(d.statusDots !== undefined) state.statusDots = normStatusDots(d.statusDots);
        if(d.defaultSections !== undefined) state.defaultSections = normPrefsList(d.defaultSections, DEFAULT_SECTIONS);
        if(d.shelfPlates !== undefined){
          state.shelfPlates = normPlates(d.shelfPlates);
          byId("platesOn").checked = state.shelfPlates.show;
        }
        if(d.groupLayout !== undefined) state.groupLayout = normLayoutMap(d.groupLayout);
        if(d.defaultGroupLayout !== undefined) state.defaultGroupLayout = normLayout(d.defaultGroupLayout, "shelf");
        if(typeof d.sortBy === "string") state.sortBy = d.sortBy;
        if(d.dir === "asc" || d.dir === "desc") state.dir = d.dir;
        if(typeof d.groupBy === "string" && byId("groupBy").querySelector('[value="' + d.groupBy + '"]')){
          state.groupBy = d.groupBy;
          byId("groupBy").value = d.groupBy;
          byId("groupStyleField").hidden = state.groupBy === "none";
          updateMoveSeg();
        }
        if(d.groupStyle === "own" || d.groupStyle === "continuous"){
          state.groupStyle = d.groupStyle;
          byId("groupStyle").value = d.groupStyle;
        }
        buildSortOptions();
        byId("dir").value = state.dir;
        render();
      }
    }, function(){});
    db.collection("books").onSnapshot(function(snap){
      var next = {};
      var migrated = [];
      snap.docs.forEach(function(doc){
        var d = doc.data() || {};
        d.id = doc.id;
        if(migrateSections(d)) migrated.push(d);
        next[doc.id] = d;
      });
      state.books = next;
      migrated.forEach(saveBook);
      state.loaded = true;
      setSaveQuiet("Saved to your account", "");
      render();
    }, function(err){
      state.loaded = true;
      setSave(err && err.code === "not_granted" ? "Not saving — permission declined" : "Shelf offline", "warn");
      render();
    });
  });
} else {
  state.loaded = true;
  setSave("Not saving in this view", "off");
  render();
}
})();
</script>

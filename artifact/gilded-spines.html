<title>Gilded Spines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Spectral:wght@300;400;600&display=swap">

<style>
:root{
  --ink:#07060B;
  --night:#100C17;
  --velvet:#1A1424;
  --velvet-2:#241A31;
  --velvet-3:#2E2240;
  --wood:#3A2A20;
  --wood-dark:#1E1410;
  --wood-light:#5E4432;
  --gilt:#C9A24C;
  --gilt-bright:#EACB80;
  --gilt-dim:#8A7139;
  --parchment:#F1E8D5;
  --parchment-2:#E4D7BB;
  --parchment-3:#D3C29E;
  --page-ink:#2B2129;
  --page-ink-dim:#6A5B62;
  --rose:#8E1F35;
  --rose-bright:#C94059;
  --sage:#6E8F72;
  --amethyst:#7A5AA6;
  --amber:#B4813C;
  --dim:#9C8BAC;
  --dimmer:#6E6180;
  --hair:rgba(201,162,76,.22);
  --hair-soft:rgba(201,162,76,.12);
  --f-display:"Cinzel",'Trajan Pro',Georgia,serif;
  --f-body:"EB Garamond",Georgia,'Times New Roman',serif;
  --f-data:"Spectral",Georgia,serif;
  --shelf-max:1180px;
}

*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:var(--ink);color:var(--parchment-2);
  font-family:var(--f-body);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}

/* ---------- ambient chamber ---------- */
.chamber{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 520px at 50% -8%, rgba(201,162,76,.16), transparent 70%),
    radial-gradient(700px 500px at 12% 18%, rgba(122,90,166,.13), transparent 72%),
    radial-gradient(680px 480px at 88% 26%, rgba(142,31,53,.11), transparent 72%),
    linear-gradient(180deg,var(--night) 0%, var(--ink) 55%, #05040A 100%);
}
.chamber::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 30%, transparent 42%, rgba(0,0,0,.62) 100%);
}
.motes{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.mote{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:var(--gilt-bright);opacity:0;
  box-shadow:0 0 7px 2px rgba(234,203,128,.5);
  animation:drift linear infinite;
}
@keyframes drift{
  0%{transform:translateY(20px) translateX(0);opacity:0}
  12%{opacity:.5}
  80%{opacity:.32}
  100%{transform:translateY(-95vh) translateX(28px);opacity:0}
}
@media (prefers-reduced-motion:reduce){.mote{display:none}}

.wrap{position:relative;z-index:2;max-width:var(--shelf-max);margin:0 auto;padding-block:34px 80px;padding-left:20px;padding-right:20px}

/* ---------- header ---------- */
.masthead{text-align:center;margin-bottom:26px}
.crest{width:56px;height:56px;margin:0 auto 10px;display:block;fill:none;stroke:var(--gilt);stroke-width:1.1;opacity:.92}
h1{
  font-family:var(--f-display);font-weight:600;
  font-size:clamp(2.1rem,6vw,3.3rem);
  letter-spacing:.14em;margin:0;color:var(--parchment);text-wrap:balance;
  text-shadow:0 0 34px rgba(201,162,76,.34), 0 2px 0 rgba(0,0,0,.6);
}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px auto 0;max-width:420px;color:var(--gilt-dim)}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--hair),transparent)}
.rule svg{width:13px;height:13px;fill:var(--gilt);opacity:.8}
.tagline{font-family:var(--f-data);font-weight:300;font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);margin:11px 0 0}

/* ---------- shelf tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 18px}
.tab{
  font-family:var(--f-display);font-size:.73rem;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);background:linear-gradient(180deg,var(--velvet-2),var(--velvet));
  border:1px solid var(--hair-soft);border-radius:2px;padding:10px 15px;cursor:pointer;
  transition:color .2s,border-color .2s,background .2s,transform .2s;
}
.tab:hover{color:var(--parchment-2);border-color:var(--hair);transform:translateY(-1px)}
.tab[aria-selected="true"]{
  color:var(--ink);background:linear-gradient(180deg,var(--gilt-bright),var(--gilt));
  border-color:var(--gilt-bright);box-shadow:0 0 22px rgba(201,162,76,.3);
}
.tab .n{font-family:var(--f-data);opacity:.62;margin-left:7px;font-size:.9em}

/* ---------- toolbar ---------- */
.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
  padding:16px 18px;margin-bottom:30px;
  background:linear-gradient(180deg,rgba(36,26,49,.82),rgba(16,12,23,.82));
  border:1px solid var(--hair-soft);border-radius:3px;
  box-shadow:inset 0 1px 0 rgba(201,162,76,.08), 0 14px 34px rgba(0,0,0,.5);
}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.grow{flex:1 1 200px}
label.lbl{font-family:var(--f-display);font-size:.6rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--gilt-dim)}
input[type=text],input[type=search],select,textarea{
  font-family:var(--f-body);font-size:.96rem;color:var(--parchment);
  background:rgba(7,6,11,.72);border:1px solid var(--hair-soft);border-radius:2px;
  padding:8px 10px;width:100%;transition:border-color .2s,box-shadow .2s;
}
select{
  appearance:none;cursor:pointer;padding-right:28px;
  background-image:linear-gradient(45deg,transparent 50%,var(--gilt-dim) 50%),linear-gradient(135deg,var(--gilt-dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%, calc(100% - 10px) 55%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.spine:focus-visible,.faced:focus-visible,.pips:focus-visible,.swatch:focus-visible{
  outline:2px solid var(--gilt-bright);outline-offset:2px;
}
input:focus,select:focus,textarea:focus{border-color:var(--gilt-dim);box-shadow:0 0 0 3px rgba(201,162,76,.1)}

.btn{
  font-family:var(--f-display);font-size:.68rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--parchment-2);cursor:pointer;
  background:linear-gradient(180deg,var(--velvet-3),var(--velvet));
  border:1px solid var(--hair);border-radius:2px;padding:10px 14px;white-space:nowrap;
  transition:color .2s,border-color .2s,transform .2s,box-shadow .2s,background .2s;
}
.btn:hover{color:var(--ink);background:linear-gradient(180deg,var(--gilt-bright),var(--gilt));border-color:var(--gilt-bright);transform:translateY(-1px)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:linear-gradient(180deg,var(--gilt-bright),var(--gilt))}
.btn.small{padding:6px 10px;font-size:.6rem}
.btn.danger:hover{background:linear-gradient(180deg,var(--rose-bright),var(--rose));border-color:var(--rose-bright);color:var(--parchment)}
.toggle{display:flex;align-items:center;gap:7px;font-family:var(--f-data);font-size:.84rem;color:var(--dim);cursor:pointer;padding-bottom:9px}
.toggle input{accent-color:var(--gilt);width:15px;height:15px;cursor:pointer}

/* ---------- shelves ---------- */
.shelf-group{margin-bottom:52px}
.plate{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.plate i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--hair),transparent)}
.plate h2{font-family:var(--f-display);font-weight:500;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gilt);margin:0;text-align:center;text-wrap:balance}
.plate .cnt{font-family:var(--f-data);font-size:.74rem;color:var(--dimmer);letter-spacing:.08em}

.shelf{position:relative;padding:0 6px}
.shelf + .shelf{margin-top:24px}
.books{display:flex;align-items:flex-end;gap:5px;flex-wrap:wrap;padding:0 8px}
.plank{
  height:15px;border-radius:0 0 3px 3px;
  background:linear-gradient(180deg,var(--wood-light) 0%, var(--wood) 32%, var(--wood-dark) 100%);
  box-shadow:inset 0 1px 0 rgba(255,220,170,.18), 0 3px 0 rgba(0,0,0,.55), 0 22px 34px -10px rgba(0,0,0,.85);
  position:relative;
}
.plank::before{content:"";position:absolute;left:0;right:0;top:-9px;height:9px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.5));pointer-events:none}

/* ---------- spines ---------- */
.spine{
  position:relative;flex:0 0 auto;width:var(--w);height:var(--h);
  border:0;padding:0;cursor:pointer;border-radius:2px 5px 5px 2px;
  background:
    linear-gradient(90deg, rgba(0,0,0,.5) 0%, rgba(255,255,255,.09) 9%, rgba(255,255,255,.03) 26%, rgba(0,0,0,.16) 72%, rgba(0,0,0,.5) 100%),
    linear-gradient(180deg, color-mix(in srgb, var(--c) 88%, white 12%), var(--c) 22%, color-mix(in srgb, var(--c) 78%, black 22%) 100%);
  box-shadow:0 2px 0 rgba(0,0,0,.5), 0 12px 20px -10px rgba(0,0,0,.8);
  transition:transform .26s cubic-bezier(.2,.8,.3,1), box-shadow .26s, filter .26s;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:22px 0 27px;overflow:hidden;transform-origin:bottom center;
}
.spine::before,.spine::after{
  content:"";position:absolute;left:5px;right:5px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gilt),transparent);opacity:.62;
}
.spine::before{top:15px}
.spine::after{bottom:15px}
.spine:hover,.spine:focus-visible{
  transform:translateY(-16px);
  box-shadow:0 18px 30px -8px rgba(0,0,0,.9), 0 0 30px rgba(201,162,76,.3);
  filter:brightness(1.13);z-index:5;
}
.spine.lean{transform:rotate(7deg) translateY(-1px)}
.spine.lean:hover,.spine.lean:focus-visible{transform:rotate(7deg) translateY(-14px)}

.spine-text{
  writing-mode:vertical-rl;text-orientation:mixed;
  font-family:var(--f-display);font-weight:600;font-size:var(--fs);letter-spacing:.055em;
  color:var(--gilt-bright);text-shadow:0 1px 1px rgba(0,0,0,.85);
  flex:1 1 auto;min-height:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.spine-sub{
  writing-mode:vertical-rl;text-orientation:mixed;
  font-family:var(--f-data);font-weight:300;font-size:calc(var(--fs) * .74);
  letter-spacing:.1em;color:rgba(241,232,213,.66);
  margin-top:9px;flex:0 1 auto;min-height:0;max-height:58px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.spine-num{
  position:absolute;top:21px;left:0;right:0;text-align:center;
  font-family:var(--f-data);font-size:calc(var(--fs) * .72);color:var(--gilt);opacity:.8;
}
.spine-pips{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.spine-pips b{width:3px;height:3px;border-radius:50%;background:var(--gilt-bright);box-shadow:0 0 4px rgba(234,203,128,.8)}
.spine-pips b.half{background:linear-gradient(90deg,var(--gilt-bright) 50%,rgba(234,203,128,.2) 50%)}
.ribbon{
  position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:9px;height:22px;
  background:linear-gradient(180deg,var(--rose-bright),var(--rose));
  clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%);
  box-shadow:0 1px 3px rgba(0,0,0,.6);z-index:2;
}
.progress-band{position:absolute;left:0;bottom:0;width:100%;height:4px;background:rgba(0,0,0,.45)}
.progress-band i{display:block;height:100%;background:linear-gradient(90deg,var(--gilt),var(--gilt-bright));box-shadow:0 0 8px rgba(234,203,128,.6)}
.status-dot{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--sd);box-shadow:0 0 6px var(--sd);z-index:2}

/* ---------- face-out books ---------- */
.faced{
  position:relative;flex:0 0 auto;width:var(--w);height:var(--h);
  border:0;padding:0;cursor:pointer;border-radius:2px 4px 4px 2px;overflow:hidden;
  background:var(--c);
  box-shadow:
    inset 5px 0 0 rgba(0,0,0,.32), inset 7px 0 1px rgba(255,255,255,.08),
    0 2px 0 rgba(0,0,0,.5), 0 14px 22px -10px rgba(0,0,0,.85);
  transition:transform .26s cubic-bezier(.2,.8,.3,1), box-shadow .26s, filter .26s;
  transform-origin:bottom center;display:block;
}
.faced:hover,.faced:focus-visible{
  transform:translateY(-16px);
  box-shadow:inset 5px 0 0 rgba(0,0,0,.32), 0 20px 30px -8px rgba(0,0,0,.9), 0 0 30px rgba(201,162,76,.3);
  filter:brightness(1.08);z-index:5;
}
.faced img{width:100%;height:100%;object-fit:cover;display:block;max-width:100%}

/* generated cover — shared by shelf + open book preview */
.cover-gen{
  container-type:inline-size;
  width:100%;height:100%;position:relative;
  background:
    radial-gradient(120% 80% at 22% 8%, rgba(255,255,255,.14), transparent 60%),
    linear-gradient(165deg, color-mix(in srgb, var(--c) 82%, white 18%), var(--c) 42%, color-mix(in srgb, var(--c) 62%, black 38%) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:9cqw 8cqw;text-align:center;overflow:hidden;
}
.cover-gen::before{
  content:"";position:absolute;inset:5cqw;
  border:1px solid rgba(234,203,128,.5);
}
.cover-gen::after{
  content:"";position:absolute;inset:6.6cqw;
  border:1px solid rgba(234,203,128,.22);
}
.cg-orn{width:11cqw;height:11cqw;fill:rgba(234,203,128,.8);margin-bottom:4cqw;flex:0 0 auto}
.cg-title{
  font-family:var(--f-display);font-weight:600;
  font-size:calc(9.2cqw * var(--cscale,1));line-height:1.14;letter-spacing:.02em;
  color:#F6EBD2;text-shadow:0 1px 2px rgba(0,0,0,.6);
  text-wrap:balance;overflow:hidden;
}
.cg-rule{width:34cqw;height:1px;background:rgba(234,203,128,.6);margin:4cqw 0}
.cg-author{
  font-family:var(--f-data);font-weight:300;font-size:calc(5.4cqw * var(--cscale,1));
  letter-spacing:.14em;text-transform:uppercase;color:rgba(246,235,210,.78);
  overflow:hidden;
}
.cg-series{
  position:absolute;bottom:9cqw;left:0;right:0;
  font-family:var(--f-data);font-size:4.6cqw;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(234,203,128,.72);padding:0 8cqw;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}

.empty{text-align:center;padding:56px 20px;color:var(--dimmer);font-family:var(--f-body);font-style:italic;font-size:1.08rem;border:1px dashed var(--hair-soft);border-radius:3px}
.empty strong{display:block;font-family:var(--f-display);font-style:normal;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gilt-dim);margin-bottom:9px}

/* ---------- footer ---------- */
.footer{
  margin-top:34px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  font-family:var(--f-data);font-size:.78rem;color:var(--dimmer);
  border-top:1px solid var(--hair-soft);padding-top:16px;
}
.save-state{display:flex;align-items:center;gap:8px;letter-spacing:.06em}
.save-state .lamp{width:7px;height:7px;border-radius:50%;background:var(--gilt);box-shadow:0 0 8px var(--gilt)}
.save-state.warn .lamp{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.save-state.off .lamp{background:var(--dimmer);box-shadow:none}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stats span b{color:var(--parchment-2);font-weight:600}

/* ---------- overlay + open book ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;
  display:flex;align-items:flex-start;justify-content:center;
  padding:28px 16px 44px;
  background:radial-gradient(70% 70% at 50% 45%, rgba(10,8,16,.86), rgba(3,2,6,.97));
  backdrop-filter:blur(3px);animation:fadeIn .24s ease both;
  overflow-y:auto;overscroll-behavior:contain;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.spread{
  position:relative;width:min(980px,100%);margin:auto;
  display:grid;grid-template-columns:1fr 1fr;
  transform-style:preserve-3d;
  animation:openBook .5s cubic-bezier(.2,.8,.25,1) both;
  filter:drop-shadow(0 40px 60px rgba(0,0,0,.8));
}
@keyframes openBook{
  from{transform:perspective(2000px) rotateY(-26deg) scale(.9);opacity:0}
  to{transform:perspective(2000px) rotateY(0deg) scale(1);opacity:1}
}
.page{
  background:
    radial-gradient(120% 100% at 0% 0%, rgba(255,255,255,.5), transparent 55%),
    linear-gradient(175deg,var(--parchment) 0%, var(--parchment-2) 62%, var(--parchment-3) 100%);
  color:var(--page-ink);padding:30px 30px 70px;position:relative;
}
.page-left{border-radius:4px 0 0 4px;box-shadow:inset -26px 0 34px -24px rgba(70,48,30,.55)}
.page-right{
  border-radius:0 4px 4px 0;box-shadow:inset 26px 0 34px -24px rgba(70,48,30,.55);
  transform-origin:left center;animation:turnPage .58s cubic-bezier(.22,.82,.24,1) both;
}
@keyframes turnPage{from{transform:rotateY(-74deg)}to{transform:rotateY(0)}}
@media (prefers-reduced-motion:reduce){.spread,.page-right{animation:none}}
.gutter{
  position:absolute;left:50%;top:0;bottom:0;width:24px;transform:translateX(-50%);
  background:linear-gradient(90deg,rgba(96,66,40,.42),rgba(58,38,22,.16) 40%,rgba(58,38,22,.16) 60%,rgba(96,66,40,.42));
  pointer-events:none;z-index:3;
}
.page::after{content:"";position:absolute;inset:12px;border:1px solid rgba(120,92,56,.22);pointer-events:none;border-radius:2px}

.page h3{
  font-family:var(--f-display);font-weight:600;
  font-size:clamp(1.3rem,2.6vw,1.85rem);line-height:1.16;letter-spacing:.02em;
  margin:0 0 6px;color:#241B22;text-wrap:balance;
}
.page .byline{font-family:var(--f-body);font-style:italic;font-size:1.05rem;color:var(--page-ink-dim);margin:0 0 18px}
.folio{font-family:var(--f-display);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:#8A7351;margin:0 0 16px}
.page-rule{height:1px;background:linear-gradient(90deg,rgba(138,115,81,.45),rgba(138,115,81,.08));margin:18px 0}

.meta{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;align-items:baseline;margin:0 0 4px}
.meta dt{font-family:var(--f-display);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:#8A7351;padding-top:5px}
.meta dd{margin:0;font-size:1rem}
.meta input,.meta select{
  background:rgba(255,255,255,.4);border:1px solid rgba(138,115,81,.3);
  color:var(--page-ink);font-family:var(--f-body);padding:5px 8px;border-radius:2px;
}
.meta select{background-image:linear-gradient(45deg,transparent 50%,#8A7351 50%),linear-gradient(135deg,#8A7351 50%,transparent 50%)}
.meta input:focus,.meta select:focus{border-color:#8A7351;box-shadow:0 0 0 3px rgba(138,115,81,.14)}
.row2{display:flex;gap:8px}
.row2 input.num{width:76px}

.blurb{
  font-size:1rem;line-height:1.6;color:#3A2E36;
  background:rgba(255,255,255,.34);border:1px solid rgba(138,115,81,.24);
  border-radius:2px;padding:10px 12px;min-height:92px;resize:vertical;width:100%;
}

/* ratings */
.ratings{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.rating-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.rating-row .name{font-family:var(--f-display);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#7A6544}
.pips{display:inline-flex;gap:3px;cursor:pointer;border-radius:2px}
.pip{position:relative;width:19px;height:19px;display:block}
.pip svg{width:100%;height:100%;display:block}
.pip-ghost{fill:rgba(120,96,64,.26)}
.pip-fill{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--fill)) 0 0)}
.pip-fill svg{fill:var(--pc)}
.rating-row .val{font-family:var(--f-data);font-size:.86rem;color:#7A6544;min-width:32px;text-align:right;font-variant-numeric:tabular-nums}

.notes-label{font-family:var(--f-display);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:#8A7351;margin:16px 0 6px;display:block}
textarea.notes{
  width:100%;min-height:150px;resize:vertical;
  font-family:var(--f-body);font-size:1.02rem;line-height:1.68;color:#33272F;
  background:
    repeating-linear-gradient(180deg,transparent 0 27px, rgba(138,115,81,.15) 27px 28px),
    rgba(255,255,255,.24);
  border:1px solid rgba(138,115,81,.22);border-radius:2px;padding:6px 10px;
}
textarea.notes.tall{min-height:190px}
textarea.notes::placeholder{color:#A2907C;font-style:italic}

/* ---------- appearance panel ---------- */
details.appear{
  margin-top:6px;border:1px solid rgba(138,115,81,.28);border-radius:2px;
  background:rgba(255,255,255,.22);
}
details.appear > summary{
  list-style:none;cursor:pointer;padding:9px 12px;
  font-family:var(--f-display);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:#7A6544;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
details.appear > summary::-webkit-details-marker{display:none}
details.appear > summary::after{content:"+";font-family:var(--f-data);font-size:1rem;color:#8A7351}
details.appear[open] > summary::after{content:"\2013"}
.appear-body{padding:4px 12px 14px;display:flex;flex-direction:column;gap:14px}

.cover-preview{
  width:104px;aspect-ratio:2/3;flex:0 0 auto;border-radius:2px;overflow:hidden;
  background:var(--c);
  box-shadow:inset 4px 0 0 rgba(0,0,0,.28), 0 6px 14px -6px rgba(0,0,0,.6);
}
.cover-preview img{width:100%;height:100%;object-fit:cover;display:block}
.cover-area{display:flex;gap:14px;align-items:flex-start}
.cover-ctl{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}
.hintline{font-family:var(--f-data);font-size:.76rem;color:#8A7351;line-height:1.4;margin:0}

.seg{display:inline-flex;border:1px solid rgba(138,115,81,.34);border-radius:2px;overflow:hidden}
.seg button{
  font-family:var(--f-display);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;
  padding:7px 12px;border:0;cursor:pointer;background:rgba(255,255,255,.3);color:#6A5B44;
}
.seg button + button{border-left:1px solid rgba(138,115,81,.28)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#DCBB72,#C9A24C);color:#2A2119}

.sub-label{font-family:var(--f-display);font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:#8A7351}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatch{
  width:24px;height:24px;border-radius:2px;cursor:pointer;border:1px solid rgba(0,0,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);padding:0;
}
.swatch[aria-pressed="true"]{outline:2px solid #C9A24C;outline-offset:2px}
.swatch.custom{display:grid;place-items:center;background:rgba(255,255,255,.4);position:relative;overflow:hidden}
.swatch.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;border:0;padding:0}
.swatch.custom svg{width:13px;height:13px;fill:#8A7351}

.checks{display:flex;flex-wrap:wrap;gap:10px 16px}
.check{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-data);font-size:.82rem;color:#5C4E44;cursor:pointer}
.check input{accent-color:#8E7332;width:14px;height:14px;cursor:pointer}

.slider-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
input[type=range]{
  width:100%;accent-color:#A8873E;background:transparent;height:22px;padding:0;border:0;
}
.slider-row .num-out{font-family:var(--f-data);font-size:.78rem;color:#8A7351;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- close / actions ---------- */
.close-book{
  position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);z-index:6;
  font-family:var(--f-display);font-size:.64rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--parchment);cursor:pointer;
  background:linear-gradient(180deg,var(--rose-bright),#6E1526);
  border:1px solid rgba(234,203,128,.5);border-radius:20px;padding:11px 26px;
  box-shadow:0 8px 22px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .2s,box-shadow .2s;display:inline-flex;align-items:center;gap:9px;
}
.close-book:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.7), 0 0 24px rgba(201,162,76,.3)}
.close-book svg{width:12px;height:12px;fill:currentColor}

.page-actions{margin-top:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.page-actions .btn{background:rgba(255,255,255,.34);border-color:rgba(138,115,81,.32);color:#4A3A42}
.page-actions .btn:hover{background:linear-gradient(180deg,var(--gilt-bright),var(--gilt));color:#241B22;border-color:var(--gilt)}
.fav-toggle{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-display);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#7A6544;cursor:pointer;background:none;border:0;padding:6px 0}
.fav-toggle svg{width:15px;height:15px;fill:rgba(120,96,64,.3);transition:fill .2s}
.fav-toggle.on svg{fill:var(--rose)}

/* settings sheet */
.sheet{
  width:min(560px,100%);margin:auto;
  background:linear-gradient(180deg,var(--velvet-2),var(--night));
  border:1px solid var(--hair);border-radius:4px;
  box-shadow:0 30px 70px rgba(0,0,0,.8);padding:26px 26px 22px;
  animation:openBook .4s cubic-bezier(.2,.8,.25,1) both;
}
.sheet h3{font-family:var(--f-display);font-weight:600;font-size:1.1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gilt);margin:0 0 4px}
.sheet p.hint{font-size:.94rem;color:var(--dim);margin:0 0 20px;font-style:italic}
.cat-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.cat-item{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;padding:9px 11px;background:rgba(7,6,11,.5);border:1px solid var(--hair-soft);border-radius:2px}
.cat-item svg{width:18px;height:18px}
.cat-item .cname{font-family:var(--f-body);font-size:1rem;color:var(--parchment-2)}
.icon-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.icon-opt{width:34px;height:34px;display:grid;place-items:center;cursor:pointer;background:rgba(7,6,11,.6);border:1px solid var(--hair-soft);border-radius:2px}
.icon-opt svg{width:17px;height:17px}
.icon-opt[aria-pressed="true"]{border-color:var(--gilt);box-shadow:0 0 14px rgba(201,162,76,.3)}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;border-top:1px solid var(--hair-soft);padding-top:16px}

/* ---------- responsive ---------- */
@media (max-width:760px){
  .spread{grid-template-columns:1fr;border-radius:4px}
  .gutter{display:none}
  .page{padding:24px 20px 30px}
  .page-left{border-radius:4px 4px 0 0;box-shadow:none;border-bottom:1px solid rgba(138,115,81,.3)}
  .page-right{border-radius:0 0 4px 4px;box-shadow:none;animation:none;padding-bottom:74px}
  .books{min-height:150px}
}
@media (max-width:480px){
  .wrap{padding-left:16px;padding-right:16px}
  .toolbar{padding:14px}
  .field.grow{flex:1 1 100%}
  .cover-area{flex-direction:column}
}

<script>
(function(){
"use strict";

/* ---------------- constants ---------------- */
var STATUS = {
  want:    {label:"Want to Read", color:"#7A5AA6"},
  reading: {label:"Reading",      color:"#C9A24C"},
  paused:  {label:"Paused",       color:"#B4813C"},
  read:    {label:"Read",         color:"#6E8F72"},
  dnf:     {label:"Set Aside",    color:"#7A2530"}
};
var STATUS_ORDER = ["want","reading","paused","read","dnf"];

var ICON_COLORS = {
  star:"#C9A24C", flame:"#D4573F", heart:"#C94059", tear:"#5E87AD",
  skull:"#8C806A", moon:"#7A5AA6", dagger:"#8E1F35", crown:"#B4813C",
  feather:"#6E8F72", eye:"#4F7A8C", wing:"#6E4E8F", drop:"#B06A8A"
};
var ICON_NAMES = ["star","flame","heart","tear","skull","moon","dagger","crown","feather","eye","wing","drop"];

var DEFAULT_CATEGORIES = [
  {key:"overall", label:"Overall",          icon:"star"},
  {key:"spice",   label:"Spice",            icon:"flame"},
  {key:"impact",  label:"Emotional Impact", icon:"tear"},
  {key:"scare",   label:"Scare",            icon:"skull"}
];

var PALETTE = ["#4A1F2E","#2C3A52","#3E2A4A","#22403A","#4A3520","#5A2330",
               "#1F3348","#3A2440","#2A4436","#4E3A24","#33253F","#153A3E",
               "#1B2A44","#2E2240","#5C3A1E","#123832","#402038","#2A2A3E"];

var SPINE_DEFAULTS = {title:true, author:true, series:false, number:false, pips:true};

/* ---------------- state ---------------- */
var state = {
  books:{}, categories:DEFAULT_CATEGORIES.slice(),
  tab:"all", q:"", groupBy:"none", sortBy:"series", dir:"asc",
  favOnly:false, openId:null, loaded:false
};
var db = null, assets = null, assetsChecked = false;
var saveTimers = {};

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function hash(s){
  var h = 2166136261, i; s = String(s || "");
  for(i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}
function slug(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80) || ("book-"+Date.now());
}
function byId(id){ return document.getElementById(id); }
function list(){ return Object.keys(state.books).map(function(k){ return state.books[k]; }); }

function color(b){
  if(b.spineColor) return b.spineColor;
  var seed = b.series ? b.series : (b.author || b.title || "");
  return PALETTE[hash(seed) % PALETTE.length];
}
function show(b){
  var s = b.spineShow || {};
  var out = {};
  Object.keys(SPINE_DEFAULTS).forEach(function(k){
    out[k] = (typeof s[k] === "boolean") ? s[k] : SPINE_DEFAULTS[k];
  });
  return out;
}
/* Longer titles get taller books — the same reason a fat novel is a tall novel,
   and it keeps the lettering readable instead of ellipsised into nothing. */
function autoH(b){ return 196 + Math.min(118, Math.round((b.title||"").length * 3.1)) + (hash(b.id) % 13); }
function autoW(b){ var t=(b.title||"").length; return 34 + (hash(b.id) % 5) * 5 + (t > 26 ? 6 : 0); }
function spineH(b){ return b.spineHeight || autoH(b); }
function spineW(b){ return b.spineWidth || autoW(b); }
function textScale(b){ return typeof b.spineTextSize === "number" ? b.spineTextSize : 1; }
function coverSrc(b){ return b.coverId ? ("/_blob/" + b.coverId) : null; }

/* ---------------- persistence ---------------- */
function setSave(text, cls){
  var el = byId("saveState");
  el.className = "save-state" + (cls ? " " + cls : "");
  byId("saveText").textContent = text;
}
function saveBook(b){
  if(!db) return;
  clearTimeout(saveTimers[b.id]);
  saveTimers[b.id] = setTimeout(function(){
    db.doc("books/" + b.id).set(b).then(function(){
      setSave("Saved to your account", "");
    }).catch(function(e){
      setSave(e && e.code === "not_granted" ? "Not saving — permission declined" : "Couldn't save that change", "warn");
    });
  }, 500);
}
function deleteBook(id){
  delete state.books[id];
  if(db) db.doc("books/" + id).delete().catch(function(){ setSave("Couldn't remove that book", "warn"); });
  render();
}
function saveCategories(){
  if(!db) return;
  db.doc("settings/prefs").set({categories: state.categories}).catch(function(){
    setSave("Couldn't save rating categories", "warn");
  });
}
function getAssets(){
  if(assetsChecked) return Promise.resolve(assets);
  assetsChecked = true;
  if(!(window.claude && window.claude.use)) return Promise.resolve(null);
  return window.claude.use("assets").then(function(a){ assets = a; return a; }, function(){ return null; });
}

/* ---------------- filtering / sorting / grouping ---------------- */
function matches(b){
  if(state.tab !== "all" && b.status !== state.tab) return false;
  if(state.favOnly && !b.favorite) return false;
  var q = state.q.trim().toLowerCase();
  if(!q) return true;
  return [b.title,b.author,b.series,b.notes,b.theories,b.quotes,b.description]
    .join(" ").toLowerCase().indexOf(q) !== -1;
}
function ratingOf(b, key){
  return (b.ratings && typeof b.ratings[key] === "number") ? b.ratings[key] : -1;
}
function cmp(a, b){
  var s = state.sortBy, r;
  if(s === "title") r = (a.title||"").localeCompare(b.title||"");
  else if(s === "author") r = (a.author||"").localeCompare(b.author||"") || (a.series||"").localeCompare(b.series||"") || (a.seriesNumber||0)-(b.seriesNumber||0);
  else if(s === "series") r = (a.series||"￿").localeCompare(b.series||"￿") || (a.seriesNumber||0)-(b.seriesNumber||0);
  else if(s === "number") r = (a.seriesNumber||0)-(b.seriesNumber||0);
  else if(s === "status") r = STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status);
  else if(s === "favorite") r = (b.favorite?1:0)-(a.favorite?1:0);
  else if(s === "added") r = (a.addedAt||0)-(b.addedAt||0);
  else if(s === "progress") r = (a.progress||0)-(b.progress||0);
  else if(s.indexOf("r:") === 0){ var k = s.slice(2); r = ratingOf(a,k)-ratingOf(b,k); }
  else r = 0;
  if(r === 0) r = (a.title||"").localeCompare(b.title||"");
  return state.dir === "desc" ? -r : r;
}
function groupKey(b){
  switch(state.groupBy){
    case "series":   return b.series || "Standalones";
    case "author":   return b.author || "Unattributed";
    case "status":   return (STATUS[b.status]||{}).label || "Unshelved";
    case "rating":   var v = ratingOf(b,"overall"); return v < 0 ? "Unrated" : (Math.floor(v)+(v%1?"½":"")+" of 5");
    case "favorite": return b.favorite ? "Favorites" : "The rest";
    case "letter":   return (b.title||"?").replace(/^(the|a|an)\s+/i,"").charAt(0).toUpperCase();
    default:         return "";
  }
}

/* ---------------- generated cover ---------------- */
function coverGenHTML(b, scale){
  var s = show(b);
  return '<div class="cover-gen" style="--c:' + esc(color(b)) + ';--cscale:' + (scale||1) + '">' +
    '<svg class="cg-orn" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-wing"/></svg>' +
    '<span class="cg-title">' + esc(b.title || "Untitled") + "</span>" +
    '<span class="cg-rule"></span>' +
    '<span class="cg-author">' + esc(b.author || "") + "</span>" +
    (b.series ? '<span class="cg-series">' + esc(b.series) + (b.seriesNumber ? " · " + esc(b.seriesNumber) : "") + "</span>" : "") +
    "</div>";
}
function coverInner(b, scale){
  var src = coverSrc(b);
  return src ? '<img src="' + esc(src) + '" alt="Cover of ' + esc(b.title) + '">' : coverGenHTML(b, scale);
}

/* ---------------- shelf items ---------------- */
function pipRow(b){
  var key = state.categories[0] ? state.categories[0].key : "overall";
  var v = ratingOf(b, key);
  if(v <= 0) return "";
  var h = "", i, full = Math.floor(v), half = v % 1 >= .5;
  for(i=0;i<full;i++) h += "<b></b>";
  if(half) h += '<b class="half"></b>';
  return '<span class="spine-pips">' + h + "</span>";
}
function chromeHTML(b){
  var st = STATUS[b.status] || STATUS.want;
  return '<span class="status-dot" style="--sd:' + st.color + '"></span>' +
    (b.favorite ? '<span class="ribbon"></span>' : "") +
    (b.status === "reading" && b.progress
      ? '<span class="progress-band"><i style="width:' + Math.max(2, Math.min(100, b.progress)) + '%"></i></span>'
      : "");
}
function itemHTML(b, isLast, count){
  var st = STATUS[b.status] || STATUS.want;
  var aria = esc(b.title) + ", " + esc(b.author || "unknown author") + ", " + esc(st.label) + ". Open.";
  var h = spineH(b);

  if(b.display === "front"){
    var w = Math.round(h * 0.66);
    return '<button class="faced" type="button" data-id="' + esc(b.id) + '"' +
      ' style="--h:' + h + 'px;--w:' + w + 'px;--c:' + esc(color(b)) + '"' +
      ' title="' + esc(b.title) + (b.author ? " — " + esc(b.author) : "") + '" aria-label="' + aria + '">' +
      coverInner(b, 1) + chromeHTML(b) + "</button>";
  }

  var s = show(b);
  var sub = s.series && b.series ? b.series : (s.author && b.author ? b.author : "");

  /* Fit the lettering to the room it actually has: spine height, less the
     gilt-rule padding, less whatever the sub-line takes. */
  var avail = h - 49 - (sub ? Math.min(58, sub.length * 7) + 9 : 0);
  var chars = Math.max(1, (b.title || "").length);
  var px = avail / (chars * 0.615);
  var fs = (Math.max(8.5, Math.min(15.5, px)) * textScale(b)).toFixed(2) + "px";
  var lean = (isLast && count > 3 && hash(b.id) % 3 === 0) ? " lean" : "";

  return '<button class="spine' + lean + '" type="button" data-id="' + esc(b.id) + '"' +
    ' style="--h:' + h + 'px;--w:' + spineW(b) + 'px;--c:' + esc(color(b)) + ';--fs:' + fs + '"' +
    ' title="' + esc(b.title) + (b.author ? " — " + esc(b.author) : "") + '" aria-label="' + aria + '">' +
    chromeHTML(b) +
    (s.number && b.seriesNumber ? '<span class="spine-num">' + esc(b.seriesNumber) + "</span>" : "") +
    (s.title ? '<span class="spine-text">' + esc(b.title) + "</span>" : "") +
    (sub ? '<span class="spine-sub">' + esc(sub) + "</span>" : "") +
    (s.pips ? pipRow(b) : "") + "</button>";
}

/* ---------------- render ---------------- */
function render(){
  var lib = byId("library");
  var books = list().filter(matches).sort(cmp);
  renderTabs(); renderStats();

  if(!books.length){
    lib.innerHTML = '<div class="empty"><strong>' +
      (state.loaded ? "Nothing on this shelf" : "Waking the shelf") + "</strong>" +
      (state.loaded ? "No books match what you're looking for. Try another shelf, or clear the search."
                    : "Fetching your library…") + "</div>";
    return;
  }
  var html;
  if(state.groupBy === "none"){
    html = shelfHTML("", books);
  } else {
    var order = [], groups = {};
    books.forEach(function(b){
      var k = groupKey(b);
      if(!groups[k]){ groups[k] = []; order.push(k); }
      groups[k].push(b);
    });
    if(state.groupBy === "series" || state.groupBy === "letter" || state.groupBy === "author"){
      order.sort(function(a,c){
        if(a === "Standalones") return 1;
        if(c === "Standalones") return -1;
        return a.localeCompare(c);
      });
    }
    html = order.map(function(k){ return shelfHTML(k, groups[k]); }).join("");
  }
  lib.innerHTML = html;
}
/* Pack books into rows that actually fill the width of a plank, rather than
   letting one shelf hold a single book and a metre of empty wood. */
function itemWidth(b){
  return b.display === "front" ? Math.round(spineH(b) * 0.66) : spineW(b);
}
function packRows(books, avail){
  var rows = [], cur = [], w = 0, GAP = 5;
  books.forEach(function(b){
    var bw = itemWidth(b);
    if(cur.length && w + GAP + bw > avail){ rows.push(cur); cur = []; w = 0; }
    w += (cur.length ? GAP : 0) + bw;
    cur.push(b);
  });
  if(cur.length) rows.push(cur);
  return rows;
}
function shelfWidth(){
  var lib = byId("library");
  return Math.max(120, (lib ? lib.clientWidth : 900) - 32);
}
function shelfHTML(label, books){
  var plate = label
    ? '<div class="plate"><i></i><h2>' + esc(label) + '</h2><span class="cnt">' + books.length + '</span><i></i></div>'
    : "";
  var rows = packRows(books, shelfWidth());
  var shelves = rows.map(function(row){
    var items = row.map(function(b,i){ return itemHTML(b, i === row.length-1, row.length); }).join("");
    return '<div class="shelf"><div class="books">' + items + '</div><div class="plank"></div></div>';
  }).join("");
  return '<section class="shelf-group">' + plate + shelves + "</section>";
}
function renderTabs(){
  var all = list(), counts = {all: all.length};
  STATUS_ORDER.forEach(function(s){ counts[s] = 0; });
  all.forEach(function(b){ if(counts[b.status] != null) counts[b.status]++; });
  var tabs = [{k:"all",label:"All Shelves"}].concat(STATUS_ORDER.map(function(s){ return {k:s,label:STATUS[s].label}; }));
  byId("tabs").innerHTML = tabs.map(function(t){
    if(t.k !== "all" && !counts[t.k] && ["want","reading","read"].indexOf(t.k) === -1) return "";
    return '<button class="tab" role="tab" type="button" data-tab="' + t.k + '" aria-selected="' +
      (state.tab === t.k) + '">' + esc(t.label) + '<span class="n">' + counts[t.k] + "</span></button>";
  }).join("");
}
function renderStats(){
  var all = list();
  var read = all.filter(function(b){ return b.status === "read"; });
  var rated = read.map(function(b){ return ratingOf(b,"overall"); }).filter(function(v){ return v >= 0; });
  var avg = rated.length ? (rated.reduce(function(a,c){ return a+c; },0)/rated.length).toFixed(2) : "—";
  byId("stats").innerHTML =
    "<span><b>" + all.length + "</b> volumes</span>" +
    "<span><b>" + read.length + "</b> read</span>" +
    "<span><b>" + all.filter(function(b){ return b.favorite; }).length + "</b> favorites</span>" +
    "<span>avg overall <b>" + avg + "</b></span>";
}

/* ---------------- open book ---------------- */
function pipsHTML(icon, value, key){
  var h = "", i, fill;
  for(i=1;i<=5;i++){
    fill = value >= i ? 100 : (value >= i - .5 ? 50 : 0);
    h += '<span class="pip" data-index="' + i + '">' +
      '<svg class="pip-ghost" viewBox="0 0 24 24"><use href="#ic-' + icon + '"/></svg>' +
      '<span class="pip-fill" style="--fill:' + fill + '%;--pc:' + (ICON_COLORS[icon]||"#C9A24C") + '">' +
      '<svg viewBox="0 0 24 24"><use href="#ic-' + icon + '"/></svg></span></span>';
  }
  return '<span class="pips" data-key="' + esc(key) + '" role="slider" tabindex="0" aria-label="Rating"' +
    ' aria-valuemin="0" aria-valuemax="5" aria-valuenow="' + (value < 0 ? 0 : value) + '">' + h + "</span>";
}

function openBook(id, isNew){
  var b = state.books[id];
  if(!b) return;
  state.openId = id;

  var s = show(b);
  var statusOpts = STATUS_ORDER.map(function(k){
    return '<option value="' + k + '"' + (b.status === k ? " selected" : "") + ">" + esc(STATUS[k].label) + "</option>";
  }).join("");
  var ratings = state.categories.map(function(c){
    var v = ratingOf(b, c.key);
    return '<div class="rating-row"><span class="name">' + esc(c.label) + "</span>" +
      pipsHTML(c.icon, v, c.key) +
      '<span class="val">' + (v < 0 ? "—" : (v % 1 ? v.toFixed(1) : v + ".0")) + "</span></div>";
  }).join("");
  var swatches = PALETTE.map(function(hex){
    return '<button class="swatch" type="button" data-color="' + hex + '" aria-pressed="' +
      (color(b).toLowerCase() === hex.toLowerCase()) + '" style="background:' + hex + '" aria-label="' + hex + '"></button>';
  }).join("") +
  '<span class="swatch custom" title="Pick any colour"><svg viewBox="0 0 24 24"><use href="#ic-drop"/></svg>' +
    '<input type="color" id="customColor" value="' + esc(color(b)) + '" aria-label="Custom spine colour"></span>';

  var ov = document.createElement("div");
  ov.className = "overlay";
  ov.id = "bookOverlay";
  ov.innerHTML =
  '<div class="spread" role="dialog" aria-modal="true" aria-label="' + esc(b.title || "New book") + '">' +
    '<div class="page page-left">' +
      '<p class="folio">' + (isNew ? "A new volume" : "Recto &middot; the facts") + "</p>" +
      '<h3 contenteditable="true" data-f="title" spellcheck="false">' + esc(b.title || "Untitled") + "</h3>" +
      '<p class="byline">by <span contenteditable="true" data-f="author" spellcheck="false">' + esc(b.author || "unknown") + "</span></p>" +
      '<div class="page-rule"></div>' +
      '<dl class="meta">' +
        '<dt>Series</dt><dd><input type="text" id="f-series" data-f="series" value="' + esc(b.series || "") + '" placeholder="Standalone"></dd>' +
        '<dt>Volume</dt><dd class="row2"><input class="num" type="text" id="f-num" data-f="seriesNumber" value="' + esc(b.seriesNumber == null ? "" : b.seriesNumber) + '" placeholder="#" inputmode="decimal"></dd>' +
        '<dt>Shelf</dt><dd><select id="f-status" data-f="status">' + statusOpts + "</select></dd>" +
        '<dt>Progress</dt><dd class="row2"><input class="num" type="text" id="f-prog" data-f="progress" value="' + esc(b.progress == null ? "" : b.progress) + '" placeholder="%" inputmode="numeric"></dd>' +
      "</dl>" +
      '<div class="page-rule"></div>' +
      '<span class="notes-label">The story</span>' +
      '<textarea class="blurb" id="f-desc" data-f="description" placeholder="What it&rsquo;s about…">' + esc(b.description || "") + "</textarea>" +
      '<div class="page-rule"></div>' +
      '<span class="notes-label">Ratings</span>' +
      '<div class="ratings">' + ratings + "</div>" +
      '<div class="page-rule"></div>' +

      '<details class="appear" id="appearPanel"' + (isNew ? "" : "") + '>' +
        "<summary>Cover &amp; spine</summary>" +
        '<div class="appear-body">' +
          '<div class="cover-area">' +
            '<div class="cover-preview" id="coverPreview" style="--c:' + esc(color(b)) + '">' + coverInner(b, 1) + "</div>" +
            '<div class="cover-ctl">' +
              '<span class="sub-label">On the shelf</span>' +
              '<div class="seg" id="displaySeg">' +
                '<button type="button" data-display="spine" aria-pressed="' + (b.display !== "front") + '">Spine out</button>' +
                '<button type="button" data-display="front" aria-pressed="' + (b.display === "front") + '">Front out</button>' +
              "</div>" +
              '<span class="sub-label">Cover art</span>' +
              '<div class="page-actions" style="margin-top:0">' +
                '<button class="btn small" id="uploadCover" type="button">Upload image</button>' +
                (b.coverId ? '<button class="btn small ghost danger" id="removeCover" type="button">Use default</button>' : "") +
              "</div>" +
              '<p class="hintline" id="coverHint">' + (b.coverId ? "Your own cover image." : "Using the drawn cover — it follows the spine colour.") + "</p>" +
            "</div>" +
          "</div>" +

          '<div>' +
            '<span class="sub-label">Spine colour</span>' +
            '<div class="swatches" id="swatches" style="margin-top:6px">' + swatches + "</div>" +
          "</div>" +

          '<div>' +
            '<span class="sub-label">Show on the spine</span>' +
            '<div class="checks" id="spineShow" style="margin-top:6px">' +
              '<label class="check"><input type="checkbox" data-show="title"' + (s.title?" checked":"") + ">Title</label>" +
              '<label class="check"><input type="checkbox" data-show="author"' + (s.author?" checked":"") + ">Author</label>" +
              '<label class="check"><input type="checkbox" data-show="series"' + (s.series?" checked":"") + ">Series name</label>" +
              '<label class="check"><input type="checkbox" data-show="number"' + (s.number?" checked":"") + ">Volume number</label>" +
              '<label class="check"><input type="checkbox" data-show="pips"' + (s.pips?" checked":"") + ">Rating pips</label>" +
            "</div>" +
          "</div>" +

          '<div>' +
            '<span class="sub-label">Lettering size</span>' +
            '<div class="slider-row"><input type="range" id="sizeRange" min="0.65" max="1.5" step="0.05" value="' + textScale(b) + '">' +
            '<span class="num-out" id="sizeOut">' + Math.round(textScale(b)*100) + "%</span></div>" +
          "</div>" +
          '<div>' +
            '<span class="sub-label">Book height</span>' +
            '<div class="slider-row"><input type="range" id="heightRange" min="150" max="340" step="2" value="' + spineH(b) + '">' +
            '<span class="num-out" id="heightOut">' + spineH(b) + "px</span></div>" +
          "</div>" +
          '<div>' +
            '<span class="sub-label">Spine thickness</span>' +
            '<div class="slider-row"><input type="range" id="widthRange" min="26" max="90" step="1" value="' + spineW(b) + '">' +
            '<span class="num-out" id="widthOut">' + spineW(b) + "px</span></div>" +
          "</div>" +
        "</div>" +
      "</details>" +

      '<div class="page-actions">' +
        '<button class="fav-toggle' + (b.favorite ? " on" : "") + '" id="favBtn" type="button" aria-pressed="' + !!b.favorite + '">' +
          '<svg viewBox="0 0 24 24"><use href="#ic-heart"/></svg>Favorite</button>' +
      "</div>" +
    "</div>" +

    '<div class="page page-right">' +
      '<p class="folio">Verso &middot; your marginalia</p>' +
      '<span class="notes-label">Notes</span>' +
      '<textarea class="notes tall" id="f-notes" data-f="notes" placeholder="What you thought. What wrecked you. What you&rsquo;d tattoo.">' + esc(b.notes || "") + "</textarea>" +
      '<span class="notes-label">Theories &amp; predictions</span>' +
      '<textarea class="notes" id="f-theories" data-f="theories" placeholder="Who&rsquo;s lying. Who&rsquo;s coming back. What the author is setting up.">' + esc(b.theories || "") + "</textarea>" +
      '<span class="notes-label">Lines worth keeping</span>' +
      '<textarea class="notes" id="f-quotes" data-f="quotes" placeholder="Quotes, last words, the one that got you.">' + esc(b.quotes || "") + "</textarea>" +
      '<div class="page-actions">' +
        '<button class="btn small danger" id="delBtn" type="button">Remove from shelf</button>' +
      "</div>" +
    "</div>" +
    '<div class="gutter" aria-hidden="true"></div>' +
    '<button class="close-book" id="closeBtn" type="button"><svg viewBox="0 0 24 24"><use href="#ic-close"/></svg>Close the book</button>' +
  "</div>";

  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  ov.scrollTop = 0;

  var spread = ov.querySelector(".spread");

  function refreshPreview(){
    var pv = byId("coverPreview");
    if(!pv) return;
    pv.style.setProperty("--c", color(b));
    pv.innerHTML = coverInner(b, 1);
  }

  /* ---- plain fields ---- */
  function commit(el){
    var f = el.getAttribute("data-f");
    var val = (el.isContentEditable ? el.textContent : el.value);
    if(f === "seriesNumber" || f === "progress"){
      var n = parseFloat(val);
      b[f] = isNaN(n) ? null : n;
    } else {
      b[f] = (typeof val === "string" ? val.trim() : val);
    }
    if(["title","author","series","status","progress","seriesNumber"].indexOf(f) !== -1){
      render(); refreshPreview();
    }
    saveBook(b);
  }
  spread.addEventListener("input", function(e){
    var el = e.target.closest("[data-f]");
    if(el) commit(el);
  });
  spread.addEventListener("change", function(e){
    var el = e.target.closest("[data-f]");
    if(el) commit(el);
  });

  /* ---- ratings ---- */
  function repaintRating(key){
    var row = spread.querySelector('.pips[data-key="' + key + '"]');
    if(!row) return;
    var cur = ratingOf(b, key);
    row.setAttribute("aria-valuenow", cur < 0 ? 0 : cur);
    Array.prototype.forEach.call(row.querySelectorAll(".pip"), function(p, i){
      var idx = i + 1;
      var fill = cur >= idx ? 100 : (cur >= idx - .5 ? 50 : 0);
      p.querySelector(".pip-fill").style.setProperty("--fill", fill + "%");
    });
    var valEl = row.parentNode.querySelector(".val");
    if(valEl) valEl.textContent = cur < 0 ? "—" : (cur % 1 ? cur.toFixed(1) : cur + ".0");
  }
  function setRating(key, v){
    if(!b.ratings) b.ratings = {};
    if(v <= 0) delete b.ratings[key]; else b.ratings[key] = v;
    saveBook(b); render(); repaintRating(key);
  }
  spread.addEventListener("click", function(e){
    var pip = e.target.closest(".pip");
    if(!pip) return;
    var row = pip.closest(".pips");
    var key = row.getAttribute("data-key");
    var idx = parseInt(pip.getAttribute("data-index"), 10);
    var r = pip.getBoundingClientRect();
    var v = ((e.clientX - r.left) < r.width / 2) ? idx - .5 : idx;
    if(ratingOf(b, key) === v) v = 0;
    setRating(key, v);
  });
  spread.addEventListener("keydown", function(e){
    var row = e.target.closest(".pips");
    if(!row) return;
    var key = row.getAttribute("data-key");
    var cur = Math.max(0, ratingOf(b, key));
    if(e.key === "ArrowRight" || e.key === "ArrowUp"){ e.preventDefault(); setRating(key, Math.min(5, cur + .5)); }
    else if(e.key === "ArrowLeft" || e.key === "ArrowDown"){ e.preventDefault(); setRating(key, Math.max(0, cur - .5)); }
    else if(e.key === "Home"){ e.preventDefault(); setRating(key, 0); }
    else if(e.key === "End"){ e.preventDefault(); setRating(key, 5); }
  });

  /* ---- appearance: display mode ---- */
  byId("displaySeg").addEventListener("click", function(e){
    var btn = e.target.closest("[data-display]");
    if(!btn) return;
    b.display = btn.getAttribute("data-display");
    Array.prototype.forEach.call(this.querySelectorAll("button"), function(x){
      x.setAttribute("aria-pressed", String(x.getAttribute("data-display") === b.display));
    });
    saveBook(b); render();
  });

  /* ---- appearance: colour ---- */
  byId("swatches").addEventListener("click", function(e){
    var sw = e.target.closest("[data-color]");
    if(!sw) return;
    b.spineColor = sw.getAttribute("data-color");
    Array.prototype.forEach.call(this.querySelectorAll("[data-color]"), function(x){
      x.setAttribute("aria-pressed", String(x.getAttribute("data-color").toLowerCase() === b.spineColor.toLowerCase()));
    });
    saveBook(b); render(); refreshPreview();
  });
  byId("customColor").addEventListener("input", function(){
    b.spineColor = this.value;
    saveBook(b); render(); refreshPreview();
  });

  /* ---- appearance: what shows ---- */
  byId("spineShow").addEventListener("change", function(e){
    var cb = e.target.closest("[data-show]");
    if(!cb) return;
    if(!b.spineShow) b.spineShow = show(b);
    b.spineShow[cb.getAttribute("data-show")] = cb.checked;
    saveBook(b); render();
  });

  /* ---- appearance: sliders ---- */
  function slider(inputId, outId, field, fmt){
    var inp = byId(inputId), out = byId(outId);
    inp.addEventListener("input", function(){
      var v = parseFloat(this.value);
      b[field] = v;
      out.textContent = fmt(v);
      saveBook(b); render();
    });
  }
  slider("sizeRange","sizeOut","spineTextSize", function(v){ return Math.round(v*100) + "%"; });
  slider("heightRange","heightOut","spineHeight", function(v){ return v + "px"; });
  slider("widthRange","widthOut","spineWidth", function(v){ return v + "px"; });

  /* ---- appearance: cover upload ---- */
  byId("uploadCover").addEventListener("click", function(){
    var hint = byId("coverHint");
    getAssets().then(function(a){
      if(!a){
        hint.textContent = "Image upload isn't available in this view.";
        return;
      }
      var input = byId("coverFile");
      input.value = "";
      input.onchange = function(){
        var file = input.files && input.files[0];
        if(!file) return;
        if(file.size > 20 * 1024 * 1024){
          hint.textContent = "That image is over 20 MB — try a smaller one.";
          return;
        }
        hint.textContent = "Uploading…";
        a.upload(file).then(function(res){
          b.coverId = res.id;
          saveBook(b); render(); refreshPreview();
          hint.textContent = "Your own cover image.";
          var rm = byId("removeCover");
          if(!rm){
            var holder = byId("uploadCover").parentNode;
            holder.insertAdjacentHTML("beforeend",
              '<button class="btn small ghost danger" id="removeCover" type="button">Use default</button>');
            wireRemove();
          }
        }).catch(function(){
          hint.textContent = "That upload didn't go through. Try again, or pick a smaller image.";
        });
      };
      input.click();
    });
  });
  function wireRemove(){
    var rm = byId("removeCover");
    if(!rm) return;
    rm.addEventListener("click", function(){
      var old = b.coverId;
      b.coverId = null;
      saveBook(b); render(); refreshPreview();
      byId("coverHint").textContent = "Using the drawn cover — it follows the spine colour.";
      rm.remove();
      if(old && assets && assets.delete) assets.delete(old).catch(function(){});
    });
  }
  wireRemove();

  /* ---- favorite / delete / close ---- */
  byId("favBtn").addEventListener("click", function(){
    b.favorite = !b.favorite;
    this.classList.toggle("on", b.favorite);
    this.setAttribute("aria-pressed", String(!!b.favorite));
    saveBook(b); render();
  });
  byId("delBtn").addEventListener("click", function(){
    if(!confirm("Remove “" + (b.title || "this book") + "” from the shelf? This can't be undone.")) return;
    closeBook(); deleteBook(b.id);
  });
  byId("closeBtn").addEventListener("click", closeBook);
  ov.addEventListener("mousedown", function(e){ if(e.target === ov) closeBook(); });

  var first = isNew ? spread.querySelector('[data-f="title"]') : byId("closeBtn");
  if(first) first.focus();
  if(isNew && first){
    var range = document.createRange();
    range.selectNodeContents(first);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
  }
}

function closeBook(){
  var ov = byId("bookOverlay");
  if(ov) ov.remove();
  document.body.style.overflow = "";
  state.openId = null;
  var btn = document.querySelector('[data-id="' + (window.__lastSpine || "") + '"]');
  if(btn) btn.focus();
}

/* ---------------- ratings settings ---------------- */
function openSettings(){
  var ov = document.createElement("div");
  ov.className = "overlay";
  ov.id = "setOverlay";
  ov.innerHTML =
  '<div class="sheet" role="dialog" aria-modal="true" aria-label="Rating categories">' +
    "<h3>Rating Categories</h3>" +
    '<p class="hint">Every category rates in half steps, nought to five. The first one is what shows on the spines.</p>' +
    '<div class="cat-list" id="catList"></div>' +
    '<div class="field"><label class="lbl" for="newCat">Add a category</label>' +
      '<input type="text" id="newCat" placeholder="Banter, Worldbuilding, Dragons…"></div>' +
    '<div class="icon-picker" id="iconPicker"></div>' +
    '<div class="sheet-actions">' +
      '<button class="btn ghost" id="addCat" type="button">Add category</button>' +
      '<button class="btn" id="setClose" type="button">Done</button>' +
    "</div>" +
  "</div>";
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";

  var chosenIcon = "crown";
  function drawCats(){
    byId("catList").innerHTML = state.categories.map(function(c,i){
      return '<div class="cat-item">' +
        '<svg viewBox="0 0 24 24" style="fill:' + (ICON_COLORS[c.icon]||"#C9A24C") + '"><use href="#ic-' + c.icon + '"/></svg>' +
        '<span class="cname">' + esc(c.label) + "</span>" +
        '<button class="btn small ghost" data-up="' + i + '" type="button" aria-label="Move up">&uarr;</button>' +
        '<button class="btn small ghost danger" data-rm="' + i + '" type="button" aria-label="Remove">&times;</button>' +
      "</div>";
    }).join("");
  }
  function drawIcons(){
    byId("iconPicker").innerHTML = ICON_NAMES.map(function(n){
      return '<button class="icon-opt" type="button" data-icon="' + n + '" aria-pressed="' + (n === chosenIcon) +
        '" aria-label="' + n + '"><svg viewBox="0 0 24 24" style="fill:' + ICON_COLORS[n] + '"><use href="#ic-' + n + '"/></svg></button>';
    }).join("");
  }
  drawCats(); drawIcons();

  ov.addEventListener("click", function(e){
    var ic = e.target.closest("[data-icon]");
    if(ic){ chosenIcon = ic.getAttribute("data-icon"); drawIcons(); return; }
    var rm = e.target.closest("[data-rm]");
    if(rm){
      if(state.categories.length <= 1) return;
      state.categories.splice(parseInt(rm.getAttribute("data-rm"),10),1);
      saveCategories(); drawCats(); buildSortOptions(); render(); return;
    }
    var up = e.target.closest("[data-up]");
    if(up){
      var i = parseInt(up.getAttribute("data-up"),10);
      if(i > 0){
        var t = state.categories[i-1];
        state.categories[i-1] = state.categories[i];
        state.categories[i] = t;
        saveCategories(); drawCats(); render();
      }
      return;
    }
    if(e.target === ov || e.target.id === "setClose"){ closeSettings(); return; }
    if(e.target.id === "addCat"){
      var label = byId("newCat").value.trim();
      if(!label) return;
      var key = slug(label);
      if(state.categories.some(function(c){ return c.key === key; })) return;
      state.categories.push({key:key,label:label,icon:chosenIcon});
      byId("newCat").value = "";
      saveCategories(); drawCats(); buildSortOptions(); render();
    }
  });
  byId("setClose").focus();
}
function closeSettings(){
  var ov = byId("setOverlay");
  if(ov) ov.remove();
  document.body.style.overflow = "";
}

/* ---------------- sort options ---------------- */
function buildSortOptions(){
  var sel = byId("sortBy"), keep = state.sortBy;
  var opts = [
    ["series","Series &amp; volume"],["title","Title"],["author","Author"],
    ["number","Volume number"],["status","Shelf"],["favorite","Favorites first"],
    ["added","Date added"],["progress","Progress"]
  ].map(function(o){ return '<option value="' + o[0] + '">' + o[1] + "</option>"; });
  state.categories.forEach(function(c){
    opts.push('<option value="r:' + esc(c.key) + '">Rating &middot; ' + esc(c.label) + "</option>");
  });
  sel.innerHTML = opts.join("");
  sel.value = keep;
  if(sel.value !== keep){ state.sortBy = "series"; sel.value = "series"; }
}

/* ---------------- events ---------------- */
byId("tabs").addEventListener("click", function(e){
  var t = e.target.closest("[data-tab]");
  if(!t) return;
  state.tab = t.getAttribute("data-tab");
  render();
});
byId("library").addEventListener("click", function(e){
  var s = e.target.closest("[data-id]");
  if(!s) return;
  window.__lastSpine = s.getAttribute("data-id");
  openBook(s.getAttribute("data-id"), false);
});
byId("q").addEventListener("input", function(){ state.q = this.value; render(); });
byId("groupBy").addEventListener("change", function(){ state.groupBy = this.value; render(); });
byId("sortBy").addEventListener("change", function(){ state.sortBy = this.value; render(); });
byId("dir").addEventListener("change", function(){ state.dir = this.value; render(); });
byId("favOnly").addEventListener("change", function(){ state.favOnly = this.checked; render(); });
byId("setBtn").addEventListener("click", openSettings);
byId("addBtn").addEventListener("click", function(){
  var id = "book-" + Date.now().toString(36) + "-" + Math.floor(Math.random()*1e4).toString(36);
  state.books[id] = {
    id:id, title:"Untitled", author:"", series:"", seriesNumber:null,
    status:"want", favorite:false, progress:0, ratings:{},
    description:"", notes:"", theories:"", quotes:"",
    display:"spine", coverId:null, addedAt:Date.now()
  };
  saveBook(state.books[id]); render(); openBook(id, true);
});
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape") return;
  if(byId("setOverlay")) closeSettings();
  else if(byId("bookOverlay")) closeBook();
});

/* re-pack the shelves when the window changes width */
(function(){
  var t;
  window.addEventListener("resize", function(){
    clearTimeout(t);
    t = setTimeout(render, 180);
  });
})();

/* ---------------- motes ---------------- */
(function(){
  var m = byId("motes"), i, d;
  for(i=0;i<14;i++){
    d = document.createElement("span");
    d.className = "mote";
    d.style.left = (Math.random()*100).toFixed(2) + "%";
    d.style.bottom = "-10px";
    d.style.animationDuration = (16 + Math.random()*22).toFixed(1) + "s";
    d.style.animationDelay = (-Math.random()*30).toFixed(1) + "s";
    m.appendChild(d);
  }
})();

/* ---------------- boot ---------------- */
buildSortOptions();
render();
setSave("Lighting the candles…", "off");

if(window.claude && window.claude.use){
  window.claude.use("db").then(function(store){
    if(!store){
      state.loaded = true;
      setSave("Not saving in this view", "off");
      render();
      return;
    }
    db = store;
    db.doc("settings/prefs").onSnapshot(function(snap){
      if(snap.exists){
        var d = snap.data();
        if(d && Array.isArray(d.categories) && d.categories.length){
          state.categories = d.categories;
          buildSortOptions(); render();
        }
      }
    }, function(){});
    db.collection("books").onSnapshot(function(snap){
      var next = {};
      snap.docs.forEach(function(doc){
        var d = doc.data() || {};
        d.id = doc.id;
        next[doc.id] = d;
      });
      state.books = next;
      state.loaded = true;
      setSave("Saved to your account", "");
      render();
    }, function(err){
      state.loaded = true;
      setSave(err && err.code === "not_granted" ? "Not saving — permission declined" : "Shelf offline", "warn");
      render();
    });
  });
} else {
  state.loaded = true;
  setSave("Not saving in this view", "off");
  render();
}
})();
</script>

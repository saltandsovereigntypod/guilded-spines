}
var db = null, assets = null, assetsChecked = false;
var saveTimers = {};

/* ---------------- image store (IndexedDB) ----------------
   Covers and spine images live here rather than in the book document: they are
   data URLs of a few tens of KB, far too big for a document store, and they have
   to work in the standalone build where the Artifact `assets` capability is gone. */
var IMGDB = (function(){
  var NAME = "gilded-spines-images", STORE = "images", dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(function(res, rej){
      var r = indexedDB.open(NAME, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore(STORE); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(function(db){
      return new Promise(function(res, rej){
        var t = db.transaction(STORE, mode), s = t.objectStore(STORE), out;
        out = fn(s);
        t.oncomplete = function(){ res(out && out.result !== undefined ? out.result : out); };
        t.onerror = function(){ rej(t.error); };
      });
    });
  }
  return {
    get:  function(k){ return tx("readonly",  function(s){ return s.get(k); }); },
    put:  function(k, v){ return tx("readwrite", function(s){ return s.put(v, k); }); },
    del:  function(k){ return tx("readwrite", function(s){ return s.delete(k); }); },
    keys: function(){ return tx("readonly",  function(s){ return s.getAllKeys(); }); }
  };
})();

/* Resolved data URLs, so re-renders during a drag or a search keystroke do not
   go back to IndexedDB for every book on the shelf. */
var IMGCACHE = {};
function imgKey(id, kind){ return id + ":" + kind; }
function imgGet(key){
  if(Object.prototype.hasOwnProperty.call(IMGCACHE, key)) return Promise.resolve(IMGCACHE[key]);
  return IMGDB.get(key).then(function(v){
    IMGCACHE[key] = v || null;
    return IMGCACHE[key];
  }, function(){ IMGCACHE[key] = null; return null; });
}
function imgPut(key, dataUrl){
  IMGCACHE[key] = dataUrl;
  return IMGDB.put(key, dataUrl);
}
function imgDel(key){
  delete IMGCACHE[key];
  return IMGDB.del(key).catch(function(){});
}

/* Never store the raw file — a phone photo is several megabytes and would make
   the export unusable. */
function shrinkImage(file, maxW, maxH, quality){
  return new Promise(function(res, rej){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var r = Math.min(1, maxW / img.width, maxH / img.height);
        var w = Math.max(1, Math.round(img.width * r));
        var h = Math.max(1, Math.round(img.height * r));
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", quality || 0.78));
      };
      img.onerror = rej;
      img.src = reader.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function hash(s){
  var h = 2166136261, i; s = String(s || "");
  for(i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}
function slug(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80) || ("book-"+Date.now());
}
function byId(id){ return document.getElementById(id); }
function list(){ return Object.keys(state.books).map(function(k){ return state.books[k]; }); }

/* Anything that reaches a style attribute has to survive an imported file
   written by hand: a colour that isn't a hex literal is refused, not escaped. */
function safeColor(v, fallback){
  return (typeof v === "string" && /^#([0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(v.trim()))
    ? v.trim() : fallback;
}
function safeAngle(v, fallback){
  var n = parseFloat(v);
  if(isNaN(n)) return fallback;
  n = Math.round(n / 15) * 15;
  return ((n % 360) + 360) % 360;
}
/* Mix a hex colour towards black. keep=0.55 leaves 55% of the colour, matching
   CSS color-mix(in srgb, <c> 55%, black). */
function darken(hex, keep){
  var h = safeColor(hex, "#000000").slice(1);
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  h = h.slice(0, 6);
  var out = "#", i, v;
  for(i=0;i<3;i++){
    v = Math.round(parseInt(h.substr(i*2,2),16) * keep);
    out += ("0" + Math.max(0, Math.min(255, v)).toString(16)).slice(-2);
  }
  return out;
}

function color(b){
  if(b.spineColor) return safeColor(b.spineColor, PALETTE[0]);
  var seed = b.series ? b.series : (b.author || b.title || "");
  return PALETTE[hash(seed) % PALETTE.length];
}
function spineTo(b){ return b.spineColor2 ? safeColor(b.spineColor2, null) : null; }
function spineAngle(b){ return safeAngle(b.spineAngle, SPINE_ANGLE); }
/* The cover follows the spine until it is given colours of its own; from then on
   coverColor2 is the whole story, so clearing it leaves a solid cover even when
   the spine carries a gradient. */
function coverFrom(b){ return b.coverColor ? safeColor(b.coverColor, color(b)) : color(b); }
function coverTo(b){
  if(b.coverColor2) return safeColor(b.coverColor2, null);
  return b.coverColor ? null : spineTo(b);
}
function coverAngle(b){ return safeAngle(b.coverAngle, COVER_ANGLE); }
function ribbonColor(b){ return safeColor(b.ribbonColor, DEFAULT_RIBBON); }
function statusDotOn(b){
  return typeof b.showStatusDot === "boolean" ? b.showStatusDot : state.statusDots.show;
}
function statusDotColor(b){
  return safeColor(b.dotColor, null) ||
    state.statusDots.colors[b.status] || DEFAULT_DOT_COLORS.want;
}
function dotMode(b){ return typeof b.showStatusDot === "boolean" ? (b.showStatusDot ? "show" : "hide") : "default"; }
/* The CSS keeps a solid spine's shading exactly as it was; a gradient replaces
   only the base layer, so the lit edge and inner shadow still read as an object. */
function spineBaseCSS(b){
  var to = spineTo(b);
  return to ? "linear-gradient(" + spineAngle(b) + "deg," + color(b) + "," + to + ")" : "";
}
function coverBaseCSS(b){
  var to = coverTo(b);
  return to ? "linear-gradient(" + coverAngle(b) + "deg," + coverFrom(b) + "," + to + ")" : "";
}

var FINISHES = ["leather","cloth","paper","foil","smooth"];
var FINISH_LABELS = {leather:"Leather", cloth:"Cloth", paper:"Paper", foil:"Foil", smooth:"Smooth"};
var LETTERINGS = ["gilt","blind","painted"];
var LETTER_LABELS = {gilt:"Gilt", blind:"Blind", painted:"Painted"};
function finishOf(b){ return FINISHES.indexOf(b.finish) === -1 ? "leather" : b.finish; }
/* Finish picks the default treatment; a book may still say otherwise. */
function letteringOf(b){
  if(LETTERINGS.indexOf(b.lettering) !== -1) return b.lettering;
  return finishOf(b) === "paper" ? "blind" : "gilt";
}
function hubsOn(b){
  if(typeof b.hubs === "boolean") return b.hubs;
  var f = finishOf(b);
  return f !== "cloth" && f !== "paper";
}
function displayMode(b){
  return b.display === "front" ? "front" : (b.display === "angle" ? "angle" : "spine");
}
var ANG_DEG = 26, ANG_COS = Math.cos(ANG_DEG * Math.PI / 180), ANG_SIN = Math.sin(ANG_DEG * Math.PI / 180);
var ANG_PERSP = 1000;
function angledWidth(b){
  /* Turned 26 degrees a book takes up cover*cos + thickness*sin on the plank,
     plus four pixels so it never grazes its neighbours. */
  return Math.ceil(Math.round(spineH(b) * 0.66) * ANG_COS + spineW(b) * ANG_SIN) + 4;
}
/* Perspective magnifies whatever leans toward the viewer about the element's
   centre, so the near-bottom corner of a turned book is thrown BELOW the shelf
   line and it clips into the plank. The overshoot is exact, so raise the book by
   it rather than tilting the shelf every other book stands on. */
var ANG_EYE = -0.20;            /* perspective-origin Y, as a fraction of height */
function angledDrop(b){
  var cw = Math.round(spineH(b) * 0.66), t = spineW(b), h = spineH(b);
  var zNear = (cw / 2) * ANG_SIN + (t / 2) * ANG_COS;
  /* Everything nearer the eye is magnified about the perspective origin, so the
     book's near-bottom corner is thrown this far below the shelf line. */
  return h * (1 - ANG_EYE) * zNear / (ANG_PERSP - zNear);
}
function materialClass(b){ return " fin-" + finishOf(b) + " let-" + letteringOf(b); }
/* Hubs are one gradient rather than five elements: 44 books is 220 nodes saved.
   Four or five ridges on a thin spine reads as segmentation rather than binding,
   so a narrow book gets three at most however tall it is. */
function hubCount(h, w){
  var n = Math.max(3, Math.min(5, Math.round((h - 30) / 62)));
  return w < 40 ? Math.min(3, n) : n;
}
function hubsCSS(h, w){
  var n = hubCount(h, w), step = (h - 30) / (n + 1), stops = [], i, y;
  for(i = 1; i <= n; i++){
    y = step * i;
    stops.push(
      "transparent " + (y - 2).toFixed(1) + "px",
      "rgba(255,255,255,.09) " + (y - 2).toFixed(1) + "px",
      "rgba(255,255,255,.045) " + (y - 0.8).toFixed(1) + "px",
      "rgba(0,0,0,.06) " + (y + 0.8).toFixed(1) + "px",
      "rgba(0,0,0,.15) " + (y + 2).toFixed(1) + "px",
      "transparent " + (y + 2).toFixed(1) + "px");
  }
  return "linear-gradient(180deg," + stops.join(",") + ")";
}

function show(b){
  var s = b.spineShow || {};
  var out = {};
  Object.keys(SPINE_DEFAULTS).forEach(function(k){
    out[k] = (typeof s[k] === "boolean") ? s[k] : SPINE_DEFAULTS[k];
  });
  return out;
}
function coverShow(b){
  var s = b.coverShow || {};
  var out = {};
  Object.keys(COVER_DEFAULTS).forEach(function(k){
    out[k] = (typeof s[k] === "boolean") ? s[k] : COVER_DEFAULTS[k];
  });
  return out;
}
/* Longer titles get taller books — the same reason a fat novel is a tall novel,
   and it keeps the lettering readable instead of ellipsised into nothing. */
function autoH(b){ return 196 + Math.min(118, Math.round((b.title||"").length * 3.1)) + (hash(b.id) % 13); }
function autoW(b){ var t=(b.title||"").length; return 34 + (hash(b.id) % 5) * 5 + (t > 26 ? 6 : 0); }
function spineH(b){ return b.spineHeight || autoH(b); }
function spineW(b){ return b.spineWidth || autoW(b); }
function textScale(b){ return typeof b.spineTextSize === "number" ? b.spineTextSize : 1; }
function coverSrc(b){ return b.coverId ? ("/_blob/" + b.coverId) : null; }

/* ---------------- persistence ---------------- */
function paintSave(text, cls){
  var el = byId("saveState");
  el.className = "save-state" + (cls ? " " + cls : "");
  byId("saveText").textContent = text;
}
function setSave(text, cls){ clearUndo(); paintSave(text, cls); }
/* Debounced writes and snapshot echoes are not actions the reader took, so they
   must not talk over a standing offer to undo. */
var quietUntil = 0;
function paintSaveSticky(text, cls){
  paintSave(text, cls);
  quietUntil = Date.now() + 5000;
}
function setSaveQuiet(text, cls){
  if(undoState || Date.now() < quietUntil) return;
  paintSave(text, cls);
}
function saveBook(b){
  if(!db) return;
  clearTimeout(saveTimers[b.id]);
  saveTimers[b.id] = setTimeout(function(){
    db.doc("books/" + b.id).set(b).then(function(){
      setSaveQuiet("Saved to your account", "");
    }).catch(function(e){
      setSave(e && e.code === "not_granted" ? "Not saving — permission declined" : "Couldn't save that change", "warn");
    });
  }, 500);
}
function deleteBook(id){
  delete state.books[id];
  if(db) db.doc("books/" + id).delete().catch(function(){ setSave("Couldn't remove that book", "warn"); });
  render();
}
function savePrefs(){
  if(!db) return;
  db.doc("settings/prefs").set({
    categories: state.categories,
    statusDots: state.statusDots,
    defaultSections: state.defaultSections,
    shelfPlates: state.shelfPlates,
    groupLayout: state.groupLayout,
    defaultGroupLayout: state.defaultGroupLayout,
    sortBy: state.sortBy,
    dir: state.dir,
    groupBy: state.groupBy,
    groupStyle: state.groupStyle
  }).catch(function(){
    setSave("Couldn't save your settings", "warn");
  });
}
function getAssets(){
  if(assetsChecked) return Promise.resolve(assets);
  assetsChecked = true;
  if(!(window.claude && window.claude.use)) return Promise.resolve(null);
  return window.claude.use("assets").then(function(a){ assets = a; return a; }, function(){ return null; });
}

/* ---------------- filtering / sorting / grouping ---------------- */
function matches(b){
  if(state.tab !== "all" && b.status !== state.tab) return false;
  if(state.favOnly && !b.favorite) return false;
  var q = state.q.trim().toLowerCase();
  if(!q) return true;
  return [b.title, b.author, b.series, b.description, sectionText(b)]
    .join(" ").toLowerCase().indexOf(q) !== -1;
}
function ratingOf(b, key){
  return (b.ratings && typeof b.ratings[key] === "number") ? b.ratings[key] : -1;
}
function cmp(a, b){
  var s = state.sortBy, r;
  if(s === "title") r = (a.title||"").localeCompare(b.title||"");
  else if(s === "author") r = (a.author||"").localeCompare(b.author||"") || (a.series||"").localeCompare(b.series||"") || (a.seriesNumber||0)-(b.seriesNumber||0);
  else if(s === "series") r = (a.series||"￿").localeCompare(b.series||"￿") || (a.seriesNumber||0)-(b.seriesNumber||0);
  else if(s === "number") r = (a.seriesNumber||0)-(b.seriesNumber||0);
  else if(s === "status") r = STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status);
  else if(s === "favorite") r = (b.favorite?1:0)-(a.favorite?1:0);
  else if(s === "added") r = (a.addedAt||0)-(b.addedAt||0);
  else if(s === "progress") r = (a.progress||0)-(b.progress||0);
  else if(s === "custom") r = orderOf(a)-orderOf(b);
  else if(s.indexOf("r:") === 0){ var k = s.slice(2); r = ratingOf(a,k)-ratingOf(b,k); }
  else r = 0;
  if(r === 0) r = (a.title||"").localeCompare(b.title||"");
  return state.dir === "desc" ? -r : r;
}
function groupKey(b){
  switch(state.groupBy){
    case "series":   return b.series || "Standalones";
    case "author":   return b.author || "Unattributed";
    case "status":   return (STATUS[b.status]||{}).label || "Unshelved";
    case "rating":   var v = ratingOf(b,"overall"); return v < 0 ? "Unrated" : (Math.floor(v)+(v%1?"½":"")+" of 5");
    case "favorite": return b.favorite ? "Favorites" : "The rest";
    case "letter":   return (b.title||"?").replace(/^(the|a|an)\s+/i,"").charAt(0).toUpperCase();
    default:         return "";
  }
}

/* ---------------- generated cover ---------------- */
function pipMarks(b){
  var key = state.categories[0] ? state.categories[0].key : "overall";
  var v = ratingOf(b, key);
  if(v <= 0) return "";
  var h = "", i, full = Math.floor(v), half = v % 1 >= .5;
  for(i=0;i<full;i++) h += "<b></b>";
  if(half) h += '<b class="half"></b>';
  return h;
}
function coverGenHTML(b, w){
  var len = (b.title || "").length;
  var scale = len > 44 ? .62 : len > 30 ? .74 : len > 20 ? .86 : 1;
  var cs = coverShow(b);
  var base = coverBaseCSS(b);
  var seriesLine = "";
  if(cs.series && b.series){
    seriesLine = esc(b.series) + ((cs.number && b.seriesNumber) ? " · " + esc(b.seriesNumber) : "");
  } else if(cs.number && b.seriesNumber){
    seriesLine = "Volume " + esc(b.seriesNumber);
  }
  var pips = cs.pips ? pipMarks(b) : "";
  return '<div class="cover-gen" style="--c:' + esc(coverFrom(b)) + ';--cw:' + Math.round(w) + 'px;--cscale:' + scale +
      (base ? ';--cover-base:' + base : "") + '">' +
    '<svg class="cg-orn" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-wing"/></svg>' +
    (cs.title ? '<span class="cg-title">' + esc(b.title || "Untitled") + "</span>" : "") +
    '<span class="cg-rule"></span>' +
    (cs.author && b.author ? '<span class="cg-author">' + esc(b.author) + "</span>" : "") +
    (pips ? '<span class="cg-pips' + (seriesLine ? " above" : "") + '">' + pips + "</span>" : "") +
    (seriesLine ? '<span class="cg-series">' + seriesLine + "</span>" : "") +
    "</div>";
}
/* The drawn cover is always rendered first and the stored image swapped in when
   IndexedDB answers, so a shelf of 300 books never waits on a database. */
function coverInner(b, w){
  if(b.coverImage) return coverGenHTML(b, w);
  var src = coverSrc(b);
  if(!src) return coverGenHTML(b, w);
  return '<img src="' + esc(src) + '" alt="Cover of ' + esc(b.title) + '" draggable="false"' +
    ' onerror="this.parentNode.innerHTML=' + esc(JSON.stringify(coverGenHTML(b, w))) + '">';
}
/* Swap in the stored cover and spine images once IndexedDB has them. */
function hydrateImages(root){
  if(!root) return;
  Array.prototype.forEach.call(root.querySelectorAll("[data-img-cover]"), function(el){
    var key = el.getAttribute("data-img-cover");
    el.removeAttribute("data-img-cover");
    imgGet(key).then(function(url){
      if(!url || !el.isConnected) return;
      /* Never swap a node out from under a live drag: it would replace the very
         element the pointer is captured against and the drag would die silently. */
      if(isDragging){ renderPending = true; return; }
      var gen = el.querySelector(".cover-gen");
      var img = document.createElement("img");
      img.src = url;
      img.alt = el.getAttribute("data-img-alt") || "";
      img.draggable = false;
      if(gen) gen.replaceWith(img); else el.insertBefore(img, el.firstChild);
    });
  });
  Array.prototype.forEach.call(root.querySelectorAll("[data-img-spine]"), function(el){
    var key = el.getAttribute("data-img-spine");
    el.removeAttribute("data-img-spine");
    imgGet(key).then(function(url){
      if(!url || !el.isConnected) return;
      if(isDragging){ renderPending = true; return; }
      el.style.setProperty("--spine-img", 'url("' + url + '")');
    });
  });
}

/* ---------------- stacks ---------------- */
function groupLayoutOf(gk){ return normLayout(state.groupLayout[gk], state.defaultGroupLayout); }
function isStacked(gk){ return groupLayoutOf(gk) !== "shelf"; }
function cycleLayout(gk){
  var next = LAYOUTS[(LAYOUTS.indexOf(groupLayoutOf(gk)) + 1) % LAYOUTS.length];
  if(next === state.defaultGroupLayout) delete state.groupLayout[gk];
  else state.groupLayout[gk] = next;
  savePrefs(); render();
}
function slabWidth(b){ return Math.round(spineH(b) * 0.66); }
/* A minimum so a thin volume is still tappable. */
function slabHeight(b){ return Math.max(14, spineW(b)); }
/* Seeded from the book's id through the existing hash, so a messy stack looks
   the same on every render and after a reload. */
function messyShift(id){ return (hash(id) % 2001) / 100 - 10; }
function messyTilt(id){ return (hash("tilt:" + id) % 301) / 100 - 1.5; }
function layoutBtnHTML(gk){
  if(state.groupBy === "none" || !gk) return "";
  return '<button class="grp-layout" type="button" data-glayout="' + esc(gk) +
    '" title="Shelf, neat stack or messy stack">' + LAYOUT_LABEL[groupLayoutOf(gk)] + "</button>";
}
function slabHTML(b, messy){
  var w = slabWidth(b), hgt = slabHeight(b), sh = show(b);
  var fs = Math.max(8, Math.min(13, hgt * 0.48));
  var base = spineBaseCSS(b);
  var tf = messy
    ? ";transform:translateX(" + messyShift(b.id).toFixed(1) + "px) rotate(" + messyTilt(b.id).toFixed(2) + "deg)"
    : "";
  var st = STATUS[b.status] || STATUS.want;
  var pips = sh.pips ? pipMarks(b) : "";
  return '<button class="slab leaf' + materialClass(b) + (isSelected(b) ? " sel" : "") +
      '" type="button" data-id="' + esc(b.id) + '"' +
    ' style="--slw:' + w + 'px;--slh:' + hgt + 'px;--c:' + esc(color(b)) + ';--fs:' + fs.toFixed(1) + 'px' +
      (base ? ";--leaf-base:" + base : "") + tf + '"' +
    (b.spineImage ? ' data-img-spine="' + esc(imgKey(b.id, "spine")) + '"' : "") +
    ' title="' + esc(b.title) + (b.author ? " — " + esc(b.author) : "") +
    '" aria-label="' + esc(b.title) + ", " + esc(b.author || "unknown author") + ", " + esc(st.label) + '. Open.">' +
    (state.selecting && isSelected(b)
      ? '<span class="sel-tick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg></span>' : "") +
    (sh.number && b.seriesNumber ? '<span class="slab-num">' + esc(b.seriesNumber) + "</span>" : "") +
    (sh.title ? '<span class="slab-title">' + esc(b.title) + "</span>" : "") +
    (pips ? '<span class="slab-pips">' + pips + "</span>" : "") +
  "</button>";
}
function stackHTML(st){
  var messy = groupLayoutOf(st.gk) === "stack-messy";
  /* Widest at the bottom. The sort is stable, so books of equal width keep the
     order the group already had. column-reverse then puts the first child at the
     bottom, which also makes each slab paint over the one beneath it. */
  var books = st.books.slice().sort(function(x, y){ return slabWidth(y) - slabWidth(x); });
  var widest = books.reduce(function(m, b){ return Math.max(m, slabWidth(b)); }, 0);
  var last = st.books[st.books.length - 1];
  return '<div class="stack" data-item="" data-stack="' + esc(st.gk) +
      '" data-last="' + esc(last ? last.id : "") + '" style="--sw:' + (widest + 20) + 'px">' +
    books.map(function(b){ return slabHTML(b, messy); }).join("") +
  "</div>";
}

/* ---------------- shelf items ---------------- */
function pipRow(b){
  var key = state.categories[0] ? state.categories[0].key : "overall";
  var v = ratingOf(b, key);
  if(v <= 0) return "";
  var h = "", i, full = Math.floor(v), half = v % 1 >= .5;
  for(i=0;i<full;i++) h += "<b></b>";
  if(half) h += '<b class="half"></b>';
  return '<span class="spine-pips">' + h + "</span>";
}
function isSelected(b){ return !!state.selection[b.id]; }
function chromeHTML(b){
  var st = STATUS[b.status] || STATUS.want;
  var tick = (state.selecting && isSelected(b))
    ? '<span class="sel-tick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg></span>' : "";
  return tick +
    (statusDotOn(b) ? '<span class="status-dot" style="--sd:' + esc(statusDotColor(b)) + '"></span>' : "") +
    (b.favorite ? '<span class="ribbon" style="--rb:' + esc(ribbonColor(b)) + '"></span>' : "") +
    (b.status === "reading" && b.progress
      ? '<span class="progress-band"><i style="width:' + Math.max(2, Math.min(100, b.progress)) + '%"></i></span>'
      : "");
}
/* The bookbinding parts and the lettering, shared by a spine-out book and the
   spine face of an angled one. */
function spineFaceHTML(b, h, fs, s, sub, withPages){
  return (hubsOn(b) ? '<span class="sp-hubs" style="--hubs:' + hubsCSS(h, spineW(b)) + '"></span>' : "") +
    '<span class="sp-case top"></span><span class="sp-case bot"></span>' +
    (withPages ? '<span class="sp-pages"></span>' : "") +
    (s.number && b.seriesNumber ? '<span class="spine-num">' + esc(b.seriesNumber) + "</span>" : "") +
    (s.title ? '<span class="spine-text">' + esc(b.title) + "</span>" : "") +
    (sub ? '<span class="spine-sub">' + esc(sub) + "</span>" : "") +
    (s.pips ? pipRow(b) : "");
}
function coverPartsHTML(){
  return '<span class="fc-board"></span><span class="fc-spine"></span>';
}
function spineFontSize(b, h, sub){
  /* Fit the lettering to the room it actually has: spine height, less the
     gilt-rule padding, less whatever the sub-line takes. */
  var avail = h - 49 - (sub ? Math.min(58, sub.length * 7) + 9 : 0);
  var chars = Math.max(1, (b.title || "").length);
  var px = avail / (chars * 0.615);
  return (Math.max(8.5, Math.min(15.5, px)) * textScale(b)).toFixed(2) + "px";
}
function itemHTML(b, isLast, count){
  var st = STATUS[b.status] || STATUS.want;
  var aria = esc(b.title) + ", " + esc(b.author || "unknown author") + ", " + esc(st.label) + ". Open.";
  var h = spineH(b);
  var mode = displayMode(b);
  var mat = materialClass(b);
  /* A centred 5px dot and a 9px bookmark inset 8px from the right first clear
     each other at 40px, not 34: below that the dot moves to the left edge. */
  var narrow = itemWidth(b) < 40 ? " narrow" : "";
  var tip = ' title="' + esc(b.title) + (b.author ? " — " + esc(b.author) : "") + '" aria-label="' + aria + '">';
  var s = show(b);
  var sub = s.series && b.series ? b.series : (s.author && b.author ? b.author : "");
  var fs = spineFontSize(b, h, sub);
  var base = spineBaseCSS(b);
  var coverImgAttr = b.coverImage
    ? ' data-img-cover="' + esc(imgKey(b.id, "cover")) + '" data-img-alt="Cover of ' + esc(b.title) + '"' : "";
  var spineImgAttr = b.spineImage ? ' data-img-spine="' + esc(imgKey(b.id, "spine")) + '"' : "";

  if(mode === "front"){
    var w = Math.round(h * 0.66);
    return '<button class="faced' + mat + (isSelected(b) ? " sel" : "") + narrow + '" type="button" data-id="' + esc(b.id) + '" data-item=""' +
      ' style="--h:' + h + 'px;--w:' + w + 'px;--c:' + esc(coverFrom(b)) + ';--sc:' + esc(color(b)) + '"' +
      coverImgAttr + tip +
      coverInner(b, w) + coverPartsHTML() + chromeHTML(b) + "</button>";
  }

  if(mode === "angle"){
    var cw = Math.round(h * 0.66);
    return '<button class="angled' + mat + (isSelected(b) ? " sel" : "") + narrow + '" type="button" data-id="' + esc(b.id) + '" data-item=""' +
      ' style="--h:' + h + 'px;--w:' + itemWidth(b) + 'px;--cw:' + cw + 'px;--thick:' + spineW(b) +
        'px;--c:' + esc(color(b)) + ';--fs:' + fs + ';margin-bottom:' + angledDrop(b).toFixed(1) + 'px' +
        (base ? ';--leaf-base:' + base : "") + '"' +
      spineImgAttr + coverImgAttr + tip +
      '<span class="ang-scene">' +
        '<span class="ang-side leaf spine-body">' + spineFaceHTML(b, h, fs, s, sub, false) + "</span>" +
        '<span class="ang-top"></span>' +
        '<span class="ang-front" style="--c:' + esc(coverFrom(b)) + ';--sc:' + esc(color(b)) + '">' +
          coverInner(b, cw) + coverPartsHTML() + "</span>" +
      "</span>" +
      chromeHTML(b) + "</button>";
  }

  var lean = (isLast && count > 3 && hash(b.id) % 3 === 0) ? " lean" : "";
  return '<button class="spine leaf spine-body' + lean + mat + (isSelected(b) ? " sel" : "") + narrow +
      '" type="button" data-id="' + esc(b.id) + '" data-item=""' +
    ' style="--h:' + h + 'px;--w:' + spineW(b) + 'px;--c:' + esc(color(b)) + ';--fs:' + fs +
      (base ? ';--leaf-base:' + base : "") + '"' +
    spineImgAttr + tip +
    chromeHTML(b) + spineFaceHTML(b, h, fs, s, sub, true) + "</button>";
}

/* ---------------- render ---------------- */
/* A drag holds the shelf still. Anything that wants to redraw mid-drag leaves a
   note instead, and the drag runs it once on the way out. */
var isDragging = false, renderPending = false;
function flushRender(){
  if(!renderPending) return;
  renderPending = false;
  render();
}
function render(){
  if(isDragging){ renderPending = true; return; }
  renderPending = false;
  var lib = byId("library");
  var books = list().filter(matches).sort(cmp);
  renderTabs(); renderStats();

  if(!books.length){
    lib.innerHTML = '<div class="empty"><strong>' +
      (state.loaded ? "Nothing on this shelf" : "Waking the shelf") + "</strong>" +
      (state.loaded ? "No books match what you're looking for. Try another shelf, or clear the search."
                    : "Fetching your library…") + "</div>";
    return;
  }
  var html;
  if(state.groupBy === "none"){
    html = shelfHTML("", books.map(function(b){ return {b:b}; }));
  } else {
    var g = buildGroups(books);
    if(state.groupStyle === "own"){
      html = g.order.map(function(k){
        return shelfHTML(k, groupEntries(k, g.groups[k], 0), plateKey(k));
      }).join("");
    } else {
      /* Continuous: one unbroken run of shelves. Cluster members stay adjacent
         and the join is marked, rather than each series claiming its own plank
         and leaving a metre of empty wood. */
      var entries = [];
      g.order.forEach(function(k, gi){
        entries = entries.concat(groupEntries(k, g.groups[k], gi));
      });
      html = shelfHTML("", entries);
    }
  }
  lib.innerHTML = html;
  hydrateImages(lib);
  positionPlates(lib);
  drawPlateControls();
}
/* A stacked group is one item on the plank; it does not also stand books up. */
function groupEntries(k, books, gi){
  var gk = plateKey(k);
  if(isStacked(gk)) return [{stack:{gk:gk, books:books}, gk:gk, sep: gi > 0}];
  return books.map(function(b, bi){ return {b:b, gk:gk, sep: gi > 0 && bi === 0}; });
}
/* Group names are namespaced by the grouping in force, so wording written for
   the series "Favorites" never leaks onto the Favorites group. */
function plateKey(name){ return state.groupBy + ":" + name; }
function plateName(key){
  return state.shelfPlates.labels[key] || key.slice(key.indexOf(":") + 1);
}
function drawPlateControls(){
  var btn = byId("restorePlates");
  var n = Object.keys(state.shelfPlates.hidden).length;
  btn.hidden = !(state.shelfPlates.show && n);
  btn.textContent = "Restore hidden (" + n + ")";
}
/* Plates are centred on the books they belong to by measurement, not by
   arithmetic over paddings and gaps that a stylesheet change would silently
   invalidate. */
function positionPlates(root){
  Array.prototype.forEach.call(root.querySelectorAll(".shelf"), function(shelf){
    var plates = shelf.querySelectorAll(".name-plate");
    if(!plates.length) return;
    var books = shelf.querySelectorAll("[data-item]");
    var sr = shelf.getBoundingClientRect();
    Array.prototype.forEach.call(plates, function(p){
      var a = books[parseInt(p.getAttribute("data-from"), 10)];
      var z = books[parseInt(p.getAttribute("data-to"), 10)];
      if(!a || !z){ p.hidden = true; return; }
      var left = a.getBoundingClientRect().left - sr.left;
      var right = z.getBoundingClientRect().right - sr.left;
      p.style.left = Math.round((left + right) / 2) + "px";
      if(!p.classList.contains("bare")){
        p.style.maxWidth = Math.max(28, Math.round(right - left) - 12) + "px";
      }
    });
  });
}
function buildGroups(books){
  var order = [], groups = {};
  books.forEach(function(b){
    var k = groupKey(b);
    if(!groups[k]){ groups[k] = []; order.push(k); }
    groups[k].push(b);
  });
  /* Group names follow the sort in force. Under a hand-arranged shelf that means
     the order the books themselves are in — alphabetising the groups there would
     quietly undo every group you dragged. */
  if(state.sortBy !== "custom" &&
     (state.groupBy === "series" || state.groupBy === "letter" || state.groupBy === "author")){
    order.sort(function(a,c){
      if(a === "Standalones") return 1;
      if(c === "Standalones") return -1;
      return a.localeCompare(c);
    });
  }
  return {order:order, groups:groups};
}
/* Pack books into rows that actually fill the width of a plank, rather than
   letting one shelf hold a single book and a metre of empty wood. */
function itemWidth(b){
  var m = displayMode(b);
  if(m === "front") return Math.round(spineH(b) * 0.66);
  /* Turned 26 degrees, a book takes up cover*cos + thickness*sin on the plank.
     Pack with the cover width and every row overflows. */
  if(m === "angle") return angledWidth(b);
  return spineW(b);
}
function entryWidth(e){
  if(e.stack){
    return e.stack.books.reduce(function(m, b){ return Math.max(m, slabWidth(b)); }, 0) + 20;
  }
  return itemWidth(e.b);
}
function packRows(entries, avail){
  var rows = [], cur = [], w = 0, GAP = 5, SEPW = 8;
  entries.forEach(function(e){
    var bw = entryWidth(e);
    var sep = !!e.sep;
    var lead = cur.length ? (sep ? GAP + SEPW + GAP : GAP) : 0;
    if(cur.length && w + lead + bw > avail){
      rows.push(cur); cur = []; w = 0; lead = 0; sep = false;
    }
    w += lead + bw;
    cur.push({b:e.b, stack:e.stack, sep:sep && cur.length > 0, gk:e.gk});
  });
  if(cur.length) rows.push(cur);
  return rows;
}
function shelfWidth(){
  var lib = byId("library");
  return Math.max(120, (lib ? lib.clientWidth : 900) - 32);
}
function platesHTML(row){
  if(state.groupBy === "none") return "";
  var runs = [], cur = null;
  row.forEach(function(e, i){
    if(!e.gk) { cur = null; return; }
    if(!cur || cur.gk !== e.gk){ cur = {gk:e.gk, from:i, to:i}; runs.push(cur); }
    else cur.to = i;
  });
  return runs.map(function(r){
    var pos = ' data-pkey="' + esc(r.gk) + '" data-from="' + r.from + '" data-to="' + r.to + '"';
    if(!state.shelfPlates.show || state.shelfPlates.hidden[r.gk]){
      return '<div class="name-plate bare"' + pos + ">" + layoutBtnHTML(r.gk) + "</div>";
    }
    var name = plateName(r.gk);
    return '<div class="name-plate"' + pos + ' title="' + esc(name) + '">' +
      '<span class="plate-text">' + esc(name) + "</span>" +
      layoutBtnHTML(r.gk) +
      '<button class="plate-hide" type="button" data-phide="' + esc(r.gk) +
        '" aria-label="Hide this plate" title="Hide this plate">&times;</button>' +
    "</div>";
  }).join("");
}
function shelfHTML(label, entries, gk){
  var count = entries.reduce(function(n, e){ return n + (e.stack ? e.stack.books.length : 1); }, 0);
  var plate = label
    ? '<div class="plate"><i></i><h2>' + esc(label) + '</h2><span class="cnt">' + count + "</span>" +
      layoutBtnHTML(gk) + "<i></i></div>"
    : "";
  var rows = packRows(entries, shelfWidth());
  var shelves = rows.map(function(row){
    var items = row.map(function(e,i){
      return (e.sep ? '<span class="cluster-gap" aria-hidden="true"></span>' : "") +
        (e.stack ? stackHTML(e.stack) : itemHTML(e.b, i === row.length-1, row.length));
    }).join("");
    return '<div class="shelf"><div class="books">' + items + '</div><div class="plank"></div>' +
      platesHTML(row) + "</div>";
  }).join("");
  return '<section class="shelf-group">' + plate + shelves + "</section>";
}
function renderTabs(){
  var all = list(), counts = {all: all.length};
  STATUS_ORDER.forEach(function(s){ counts[s] = 0; });
  all.forEach(function(b){ if(counts[b.status] != null) counts[b.status]++; });
  var tabs = [{k:"all",label:"All Shelves"}].concat(STATUS_ORDER.map(function(s){ return {k:s,label:STATUS[s].label}; }));
  byId("tabs").innerHTML = tabs.map(function(t){
    if(t.k !== "all" && !counts[t.k] && ["want","reading","read"].indexOf(t.k) === -1) return "";
    return '<button class="tab" role="tab" type="button" data-tab="' + t.k + '" aria-selected="' +
      (state.tab === t.k) + '">' + esc(t.label) + '<span class="n">' + counts[t.k] + "</span></button>";
  }).join("");
}
function renderStats(){
  var all = list();
  var read = all.filter(function(b){ return b.status === "read"; });
  var rated = read.map(function(b){ return ratingOf(b,"overall"); }).filter(function(v){ return v >= 0; });
  var avg = rated.length ? (rated.reduce(function(a,c){ return a+c; },0)/rated.length).toFixed(2) : "—";
  byId("stats").innerHTML =
    "<span><b>" + all.length + "</b> volumes</span>" +
    "<span><b>" + read.length + "</b> read</span>" +
    "<span><b>" + all.filter(function(b){ return b.favorite; }).length + "</b> favorites</span>" +
    "<span>avg overall <b>" + avg + "</b></span>";
}

/* ---------------- open book ---------------- */
function pipsHTML(icon, value, key){
  var h = "", i, fill;
  for(i=1;i<=5;i++){
    fill = value >= i ? 100 : (value >= i - .5 ? 50 : 0);
    h += '<span class="pip" data-index="' + i + '">' +
      '<svg class="pip-ghost" viewBox="0 0 24 24"><use href="#ic-' + icon + '"/></svg>' +
      '<span class="pip-fill" style="--fill:' + fill + '%;--pc:' + (ICON_COLORS[icon]||"#C9A24C") + '">' +
      '<svg viewBox="0 0 24 24"><use href="#ic-' + icon + '"/></svg></span></span>';
  }
  return '<span class="pips" data-key="' + esc(key) + '" role="slider" tabindex="0" aria-label="Rating"' +
    ' aria-valuemin="0" aria-valuemax="5" aria-valuenow="' + (value < 0 ? 0 : value) + '">' + h + "</span>";
}

var PAINT_FIELDS = {
  spine:{from:"spineColor", to:"spineColor2", angle:"spineAngle"},
  cover:{from:"coverColor", to:"coverColor2", angle:"coverAngle"}
};
function hasCoverArt(b){ return !!(b.coverImage || b.coverId); }
function artHint(b){
  var bits = [];
  if(hasCoverArt(b)) bits.push("your own cover");
  if(b.spineImage) bits.push("your own spine");
  if(!bits.length) return "Drawn cover and painted spine — both follow the colours below.";
  return "Using " + bits.join(" and ") + ".";
}
function swatchesHTML(target, cur){
  return PALETTE.map(function(hex){
    return '<button class="swatch" type="button" data-swatch="' + target + '" data-color="' + hex + '" aria-pressed="' +
      (cur.toLowerCase() === hex.toLowerCase()) + '" style="background:' + hex + '" aria-label="' + hex + '"></button>';
  }).join("") +
  '<span class="swatch custom" title="Pick any colour"><svg viewBox="0 0 24 24"><use href="#ic-drop"/></svg>' +
    '<input type="color" data-custom="' + target + '" value="' + esc(cur) + '" aria-label="Custom colour"></span>';
}
function paintBlockHTML(target, label, from, to, angle){
  var on = !!to, end = to || darken(from, .55);

    '<span class="sub-label">' + esc(label) + "</span>" +

    '<div class="grad-body' + (on ? " on" : "") + '" data-grad-body="' + target + '">' +
      '<div class="grad-line">' +
        '<span class="sub-label">To</span>' +
        '<input type="color" data-grad2="' + target + '" value="' + esc(end) + '" aria-label="Gradient end colour">' +
        '<span class="paint-preview" data-grad-preview="' + target + '" style="background:linear-gradient(' +
          angle + "deg," + esc(from) + "," + esc(end) + ')"></span>' +
      "</div>" +
      '<div class="grad-line">' +
        '<span class="sub-label">Angle</span>' +
        '<div class="slider-row"><input type="range" data-gangle="' + target + '" min="0" max="360" step="15" value="' + angle + '">' +
        '<span class="num-out" data-gangle-out="' + target + '">' + angle + "&deg;</span></div>" +
      "</div>" +
    "</div>" +
  "</div>";
}
function sectionPlaceholder(label){
  return SECTION_PLACEHOLDERS[label] || "Whatever belongs here.";
}
function sectionBlockHTML(sec, i, n){
  return '<div class="sec" data-sec="' + esc(sec.id) + '">' +
    '<div class="sec-head">' +
      '<span class="notes-label sec-label" contenteditable="true" spellcheck="false"' +
        ' role="textbox" aria-label="Section name" data-seclabel="' + esc(sec.id) + '">' + esc(sec.label) + "</span>" +
      '<span class="sec-tools">' +
        '<button class="sec-btn" type="button" data-secmove="up" data-sec-id="' + esc(sec.id) + '"' +
          (i === 0 ? " disabled" : "") + ' aria-label="Move section up" title="Move up">&uarr;</button>' +
        '<button class="sec-btn" type="button" data-secmove="down" data-sec-id="' + esc(sec.id) + '"' +
          (i === n - 1 ? " disabled" : "") + ' aria-label="Move section down" title="Move down">&darr;</button>' +
        '<button class="sec-btn danger" type="button" data-secdel="' + esc(sec.id) + '"' +
          ' aria-label="Delete section" title="Delete section">&times;</button>' +
      "</span>" +
    "</div>" +
    '<textarea class="notes' + (i === 0 ? " tall" : "") + '" data-sectext="' + esc(sec.id) + '"' +
      ' placeholder="' + esc(sectionPlaceholder(sec.label)) + '">' + esc(sec.text || "") + "</textarea>" +
  "</div>";
}
function dotSegHTML(mode, idPrefix){
  return '<div class="seg" id="' + idPrefix + 'Seg">' +
    ["default","show","hide"].map(function(k){
      return '<button type="button" data-dotmode="' + k + '" aria-pressed="' + (mode === k) + '">' +
        (k === "default" ? "Default" : k === "show" ? "Show" : "Hide") + "</button>";
    }).join("") + "</div>";
}
function checkRowHTML(kind, vals){
  return '<div class="checks" data-showrow="' + kind + '" style="margin-top:6px">' +
    '<label class="check"><input type="checkbox" data-show="title"' + (vals.title?" checked":"") + ">Title</label>" +
    '<label class="check"><input type="checkbox" data-show="author"' + (vals.author?" checked":"") + ">Author</label>" +
    '<label class="check"><input type="checkbox" data-show="series"' + (vals.series?" checked":"") + ">Series name</label>" +
    '<label class="check"><input type="checkbox" data-show="number"' + (vals.number?" checked":"") + ">Volume number</label>" +
    '<label class="check"><input type="checkbox" data-show="pips"' + (vals.pips?" checked":"") + ">Rating pips</label>" +
  "</div>";
}

function openBook(id, isNew){
  var b = state.books[id];
  if(!b) return;
  state.openId = id;

  var s = show(b), cs = coverShow(b);
  var statusOpts = STATUS_ORDER.map(function(k){
    return '<option value="' + k + '"' + (b.status === k ? " selected" : "") + ">" + esc(STATUS[k].label) + "</option>";
  }).join("");
  var ratings = state.categories.map(function(c){
    var v = ratingOf(b, c.key);
    return '<div class="rating-row"><span class="name">' + esc(c.label) + "</span>" +
      pipsHTML(c.icon, v, c.key) +
      '<span class="val">' + (v < 0 ? "—" : (v % 1 ? v.toFixed(1) : v + ".0")) + "</span></div>";
  }).join("");
  var ov = document.createElement("div");
  ov.className = "overlay";
  ov.id = "bookOverlay";
  ov.innerHTML =
  '<div class="spread" role="dialog" aria-modal="true" aria-label="' + esc(b.title || "New book") + '">' +
    '<div class="page page-left">' +
      '<p class="folio">' + (isNew ? "A new volume" : "Recto &middot; the facts") + "</p>" +
      '<h3 contenteditable="true" data-f="title" spellcheck="false">' + esc(b.title || "Untitled") + "</h3>" +
      '<p class="byline">by <span contenteditable="true" data-f="author" spellcheck="false">' + esc(b.author || "unknown") + "</span></p>" +
      '<div class="page-rule"></div>' +
      '<dl class="meta">' +
        '<dt>Series</dt><dd><input type="text" id="f-series" data-f="series" value="' + esc(b.series || "") + '" placeholder="Standalone"></dd>' +
        '<dt>Volume</dt><dd class="row2"><input class="num" type="text" id="f-num" data-f="seriesNumber" value="' + esc(b.seriesNumber == null ? "" : b.seriesNumber) + '" placeholder="#" inputmode="decimal"></dd>' +
        '<dt>Shelf</dt><dd><select id="f-status" data-f="status">' + statusOpts + "</select></dd>" +
        '<dt>Progress</dt><dd class="row2"><input class="num" type="text" id="f-prog" data-f="progress" value="' + esc(b.progress == null ? "" : b.progress) + '" placeholder="%" inputmode="numeric"></dd>' +
      "</dl>" +
      '<div class="page-rule"></div>' +
      '<span class="notes-label">The story</span>' +
      '<textarea class="blurb" id="f-desc" data-f="description" placeholder="What it&rsquo;s about…">' + esc(b.description || "") + "</textarea>" +
      '<div class="page-rule"></div>' +
      '<span class="notes-label">Ratings</span>' +
      '<div class="ratings">' + ratings + "</div>" +
      '<div class="page-rule"></div>' +

      '<details class="appear" id="appearPanel"' + (isNew ? "" : "") + '>' +
        "<summary>Cover &amp; spine</summary>" +
        '<div class="appear-body">' +
          '<div class="cover-area">' +
            '<div class="cover-preview' + materialClass(b) + '" id="coverPreview" style="--c:' + esc(coverFrom(b)) + '"' +
              (b.coverImage ? ' data-img-cover="' + esc(imgKey(b.id, "cover")) + '"' : "") + ">" +
              coverInner(b, 104) + "</div>" +
            '<div class="cover-ctl">' +
              '<span class="sub-label">On the shelf</span>' +
              '<div class="seg" id="displaySeg">' +
                '<button type="button" data-display="spine" aria-pressed="' + (displayMode(b) === "spine") + '">Spine out</button>' +
                '<button type="button" data-display="front" aria-pressed="' + (displayMode(b) === "front") + '">Front out</button>' +
                '<button type="button" data-display="angle" aria-pressed="' + (displayMode(b) === "angle") + '">Angled</button>' +
              "</div>" +
              '<span class="sub-label">Cover image</span>' +
              '<div class="page-actions" style="margin-top:0">' +
                '<button class="btn small" id="uploadCover" type="button">Upload</button>' +
                (hasCoverArt(b) ? '<button class="btn small ghost danger" id="removeCover" type="button">Remove</button>' : "") +
              "</div>" +
              '<span class="sub-label" style="margin-top:2px">Spine image</span>' +
              '<div class="page-actions" style="margin-top:0">' +
                '<button class="btn small" id="uploadSpine" type="button">Upload</button>' +
                (b.spineImage ? '<button class="btn small ghost danger" id="removeSpine" type="button">Remove</button>' : "") +
              "</div>" +
              '<p class="hintline" id="coverHint">' + esc(artHint(b)) + "</p>" +
            "</div>" +
          "</div>" +

          '<div class="grad-line">' +
            '<span class="sub-label">Finish</span>' +
            '<div class="seg" id="finishSeg">' +
              FINISHES.map(function(f){
                return '<button type="button" data-finish="' + f + '" aria-pressed="' +
                  (finishOf(b) === f) + '">' + FINISH_LABELS[f] + "</button>";
              }).join("") +
            "</div>" +
          "</div>" +
          '<div class="grad-line">' +
            '<span class="sub-label">Lettering</span>' +
            '<div class="seg" id="letterSeg">' +
              LETTERINGS.map(function(l){
                return '<button type="button" data-lettering="' + l + '" aria-pressed="' +
                  (letteringOf(b) === l) + '">' + LETTER_LABELS[l] + "</button>";
              }).join("") +
            "</div>" +
            '<label class="check"><input type="checkbox" id="hubsToggle"' + (hubsOn(b) ? " checked" : "") + ">Raised hubs</label>" +
          "</div>" +

          paintBlockHTML("spine", "Spine colour", color(b), spineTo(b), spineAngle(b)) +
          paintBlockHTML("cover", "Cover colour", coverFrom(b), coverTo(b), coverAngle(b)) +

          '<div>' +
            '<span class="sub-label">Show on the spine</span>' +
            checkRowHTML("spine", s) +
          "</div>" +
          '<div>' +
            '<span class="sub-label">Show on the cover</span>' +
            checkRowHTML("cover", cs) +
          "</div>" +

          '<div class="grad-line">' +
            '<span class="sub-label">Favourite bookmark</span>' +
            '<input type="color" id="ribbonColor" value="' + esc(ribbonColor(b)) + '" aria-label="Favourite bookmark colour">' +
          "</div>" +
          '<div class="grad-line">' +
            '<span class="sub-label">Status dot</span>' +
            dotSegHTML(dotMode(b), "dot") +
            '<input type="color" id="dotColorInput" value="' + esc(statusDotColor(b)) + '" aria-label="Status dot colour">' +
            (b.dotColor ? '<button class="btn small ghost" id="dotColorClear" type="button">Use status colour</button>' : "") +
          "</div>" +

          '<div>' +
            '<span class="sub-label">Lettering size</span>' +
            '<div class="slider-row"><input type="range" id="sizeRange" min="0.65" max="1.5" step="0.05" value="' + textScale(b) + '">' +
            '<span class="num-out" id="sizeOut">' + Math.round(textScale(b)*100) + "%</span></div>" +
          "</div>" +
          '<div>' +
            '<span class="sub-label">Book height</span>' +
            '<div class="slider-row"><input type="range" id="heightRange" min="150" max="340" step="2" value="' + spineH(b) + '">' +
            '<span class="num-out" id="heightOut">' + spineH(b) + "px</span></div>" +
          "</div>" +
          '<div>' +
            '<span class="sub-label">Spine thickness</span>' +
            '<div class="slider-row"><input type="range" id="widthRange" min="26" max="90" step="1" value="' + spineW(b) + '">' +
            '<span class="num-out" id="widthOut">' + spineW(b) + "px</span></div>" +
          "</div>" +
        "</div>" +
      "</details>" +

      '<div class="page-actions">' +
        '<button class="fav-toggle' + (b.favorite ? " on" : "") + '" id="favBtn" type="button" aria-pressed="' + !!b.favorite + '">' +
          '<svg viewBox="0 0 24 24"><use href="#ic-heart"/></svg>Favorite</button>' +
      "</div>" +
    "</div>" +

    '<div class="page page-right">' +
      '<p class="folio">Verso &middot; your marginalia</p>' +
      '<div id="sectionList"></div>' +
      '<button class="sec-add" id="addSection" type="button">Add a section</button>' +
      '<div class="page-actions">' +
        '<button class="btn small danger" id="delBtn" type="button">Remove from shelf</button>' +
      "</div>" +
    "</div>" +
    '<div class="gutter" aria-hidden="true"></div>' +
    '<button class="close-book" id="closeBtn" type="button"><svg viewBox="0 0 24 24"><use href="#ic-close"/></svg>Close the book</button>' +
  "</div>";

  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  ov.scrollTop = 0;

  var spread = ov.querySelector(".spread");

  function refreshPreview(){
    var pv = byId("coverPreview");
    if(!pv) return;
    pv.className = "cover-preview" + materialClass(b);
    pv.style.setProperty("--c", coverFrom(b));
    pv.innerHTML = coverInner(b, 104);
    if(b.coverImage) pv.setAttribute("data-img-cover", imgKey(b.id, "cover"));
    else pv.removeAttribute("data-img-cover");
    hydrateImages(pv.parentNode);
  }

  /* ---- plain fields ---- */
  function commit(el){
    var f = el.getAttribute("data-f");
    var val = (el.isContentEditable ? el.textContent : el.value);
    if(f === "seriesNumber" || f === "progress"){
      var n = parseFloat(val);
      b[f] = isNaN(n) ? null : n;
    } else {
      b[f] = (typeof val === "string" ? val.trim() : val);
    }
    if(["title","author","series","status","progress","seriesNumber"].indexOf(f) !== -1){
      render(); refreshPreview();
    }
    saveBook(b);
  }
  spread.addEventListener("input", function(e){
    var el = e.target.closest("[data-f]");
    if(el) commit(el);
  });
  spread.addEventListener("change", function(e){
    var el = e.target.closest("[data-f]");
    if(el) commit(el);
  });

  /* ---- ratings ---- */
  function repaintRating(key){
    var row = spread.querySelector('.pips[data-key="' + key + '"]');
    if(!row) return;
    var cur = ratingOf(b, key);
    row.setAttribute("aria-valuenow", cur < 0 ? 0 : cur);
    Array.prototype.forEach.call(row.querySelectorAll(".pip"), function(p, i){
      var idx = i + 1;
      var fill = cur >= idx ? 100 : (cur >= idx - .5 ? 50 : 0);
      p.querySelector(".pip-fill").style.setProperty("--fill", fill + "%");
    });
    var valEl = row.parentNode.querySelector(".val");
    if(valEl) valEl.textContent = cur < 0 ? "—" : (cur % 1 ? cur.toFixed(1) : cur + ".0");
  }
  function setRating(key, v){
    if(!b.ratings) b.ratings = {};
    if(v <= 0) delete b.ratings[key]; else b.ratings[key] = v;
    saveBook(b); render(); repaintRating(key);
  }
  spread.addEventListener("click", function(e){
    var pip = e.target.closest(".pip");
    if(!pip) return;
    var row = pip.closest(".pips");
    var key = row.getAttribute("data-key");
    var idx = parseInt(pip.getAttribute("data-index"), 10);
    var r = pip.getBoundingClientRect();
    var v = ((e.clientX - r.left) < r.width / 2) ? idx - .5 : idx;
    if(ratingOf(b, key) === v) v = 0;
    setRating(key, v);
  });
  spread.addEventListener("keydown", function(e){
    var row = e.target.closest(".pips");
    if(!row) return;
    var key = row.getAttribute("data-key");
    var cur = Math.max(0, ratingOf(b, key));
    if(e.key === "ArrowRight" || e.key === "ArrowUp"){ e.preventDefault(); setRating(key, Math.min(5, cur + .5)); }
    else if(e.key === "ArrowLeft" || e.key === "ArrowDown"){ e.preventDefault(); setRating(key, Math.max(0, cur - .5)); }
    else if(e.key === "Home"){ e.preventDefault(); setRating(key, 0); }
    else if(e.key === "End"){ e.preventDefault(); setRating(key, 5); }
  });

  /* ---- appearance: display mode ---- */
  byId("displaySeg").addEventListener("click", function(e){
    var btn = e.target.closest("[data-display]");
    if(!btn) return;
    b.display = btn.getAttribute("data-display");
    Array.prototype.forEach.call(this.querySelectorAll("button"), function(x){
      x.setAttribute("aria-pressed", String(x.getAttribute("data-display") === b.display));
    });
    saveBook(b); render();
  });

  /* ---- appearance: colour ---- */
  function paintFrom(t){ return t === "spine" ? color(b) : coverFrom(b); }
  function paintTo(t){ return t === "spine" ? spineTo(b) : coverTo(b); }
  function paintAngle(t){ return t === "spine" ? spineAngle(b) : coverAngle(b); }
  function afterPaint(t){
    var from = paintFrom(t), to = paintTo(t) || darken(from, .55);
    Array.prototype.forEach.call(spread.querySelectorAll('[data-swatch="' + t + '"]'), function(x){
      x.setAttribute("aria-pressed", String(x.getAttribute("data-color").toLowerCase() === from.toLowerCase()));
    });
    var pv = spread.querySelector('[data-grad-preview="' + t + '"]');
    if(pv) pv.style.background = "linear-gradient(" + paintAngle(t) + "deg," + from + "," + to + ")";
    saveBook(b); render(); refreshPreview();
  }
  spread.addEventListener("click", function(e){
    var sw = e.target.closest("[data-swatch]");
    if(!sw) return;
    var t = sw.getAttribute("data-swatch");
    b[PAINT_FIELDS[t].from] = sw.getAttribute("data-color");
    afterPaint(t);
  });
  spread.addEventListener("input", function(e){
    var cu = e.target.closest("[data-custom]"), t;
    if(cu){ t = cu.getAttribute("data-custom"); b[PAINT_FIELDS[t].from] = cu.value; afterPaint(t); return; }
    var g2 = e.target.closest("[data-grad2]");
    if(g2){ t = g2.getAttribute("data-grad2"); b[PAINT_FIELDS[t].to] = g2.value; afterPaint(t); return; }
    var ga = e.target.closest("[data-gangle]");
    if(ga){
      t = ga.getAttribute("data-gangle");
      b[PAINT_FIELDS[t].angle] = safeAngle(ga.value, t === "spine" ? SPINE_ANGLE : COVER_ANGLE);
      var out = spread.querySelector('[data-gangle-out="' + t + '"]');
      if(out) out.textContent = b[PAINT_FIELDS[t].angle] + "\u00B0";
      afterPaint(t);
    }
  });
  spread.addEventListener("change", function(e){
    var gc = e.target.closest("[data-grad]");
    if(!gc) return;
    var t = gc.getAttribute("data-grad"), f = PAINT_FIELDS[t];
    /* Pin the colour it is showing right now before changing anything, so the
       cover can go solid while the spine keeps its gradient. */
    b[f.from] = paintFrom(t);
    if(gc.checked){
      b[f.to] = darken(b[f.from], .55);
      var inp = spread.querySelector('[data-grad2="' + t + '"]');
      if(inp) inp.value = b[f.to];
    } else {
      b[f.to] = null;
    }
    var body = spread.querySelector('[data-grad-body="' + t + '"]');
    if(body) body.classList.toggle("on", gc.checked);
    afterPaint(t);
  });

  /* ---- appearance: what shows, spine and cover kept apart ---- */
  spread.addEventListener("change", function(e){
    var cb = e.target.closest("[data-show]");
    if(!cb) return;
    var row = cb.closest("[data-showrow]");
    var kind = row ? row.getAttribute("data-showrow") : "spine";
    if(kind === "cover"){
      if(!b.coverShow) b.coverShow = coverShow(b);
      b.coverShow[cb.getAttribute("data-show")] = cb.checked;
    } else {
      if(!b.spineShow) b.spineShow = show(b);
      b.spineShow[cb.getAttribute("data-show")] = cb.checked;
    }
    saveBook(b); render(); refreshPreview();
  });

  /* ---- appearance: material ---- */
  byId("finishSeg").addEventListener("click", function(e){
    var btn = e.target.closest("[data-finish]");
    if(!btn) return;
    b.finish = btn.getAttribute("data-finish");
    Array.prototype.forEach.call(this.querySelectorAll("[data-finish]"), function(x){
      x.setAttribute("aria-pressed", String(x.getAttribute("data-finish") === b.finish));
    });
    /* Finish carries defaults for lettering and hubs; reflect them where the
       book has not overridden them. */
    Array.prototype.forEach.call(byId("letterSeg").querySelectorAll("[data-lettering]"), function(x){
      x.setAttribute("aria-pressed", String(x.getAttribute("data-lettering") === letteringOf(b)));
    });
    byId("hubsToggle").checked = hubsOn(b);
    saveBook(b); render(); refreshPreview();
  });
  byId("letterSeg").addEventListener("click", function(e){
    var btn = e.target.closest("[data-lettering]");
    if(!btn) return;
    b.lettering = btn.getAttribute("data-lettering");
    Array.prototype.forEach.call(this.querySelectorAll("[data-lettering]"), function(x){
      x.setAttribute("aria-pressed", String(x.getAttribute("data-lettering") === b.lettering));
    });
    saveBook(b); render();
  });
  byId("hubsToggle").addEventListener("change", function(){
    b.hubs = this.checked;
    saveBook(b); render();
  });

  /* ---- appearance: bookmark colour and status dot ---- */
  byId("ribbonColor").addEventListener("input", function(){
    b.ribbonColor = this.value;
    saveBook(b); render();
  });
  byId("dotSeg").addEventListener("click", function(e){
    var btn = e.target.closest("[data-dotmode]");
    if(!btn) return;
    var m = btn.getAttribute("data-dotmode");
    if(m === "default") delete b.showStatusDot; else b.showStatusDot = (m === "show");
    Array.prototype.forEach.call(this.querySelectorAll("[data-dotmode]"), function(x){
      x.setAttribute("aria-pressed", String(x.getAttribute("data-dotmode") === m));
    });
    saveBook(b); render();
  });
  byId("dotColorInput").addEventListener("input", function(){
    b.dotColor = this.value;
    if(!byId("dotColorClear")){
      this.insertAdjacentHTML("afterend",
        '<button class="btn small ghost" id="dotColorClear" type="button">Use status colour</button>');
    }
    saveBook(b); render();
  });
  spread.addEventListener("click", function(e){
    if(!e.target.closest("#dotColorClear")) return;
    delete b.dotColor;
    byId("dotColorInput").value = statusDotColor(b);
    byId("dotColorClear").remove();
    saveBook(b); render();
  });

  /* ---- appearance: sliders ---- */
  function slider(inputId, outId, field, fmt){
    var inp = byId(inputId), out = byId(outId);
    inp.addEventListener("input", function(){
      var v = parseFloat(this.value);
      b[field] = v;
      out.textContent = fmt(v);
      saveBook(b); render();
    });
  }
  slider("sizeRange","sizeOut","spineTextSize", function(v){ return Math.round(v*100) + "%"; });
  slider("heightRange","heightOut","spineHeight", function(v){ return v + "px"; });
  slider("widthRange","widthOut","spineWidth", function(v){ return v + "px"; });

  /* ---- appearance: cover and spine images ---- */
  function setHint(t){ var h = byId("coverHint"); if(h) h.textContent = t; }
  function pickFile(cb){
    var input = byId("coverFile");
    input.value = "";
    input.onchange = function(){
      var f = input.files && input.files[0];
      if(f) cb(f);
    };
    input.click();
  }
  function ensureRemove(uploadId, removeId){
    if(byId(removeId)) return;
    var up = byId(uploadId);
    if(!up) return;
    up.parentNode.insertAdjacentHTML("beforeend",
      '<button class="btn small ghost danger" id="' + removeId + '" type="button">Remove</button>');
  }
  function tooBig(file){
    if(file.size <= 20 * 1024 * 1024) return false;
    setHint("That image is over 20 MB — try a smaller one.");
    return true;
  }
  byId("uploadCover").addEventListener("click", function(){
    pickFile(function(file){
      if(tooBig(file)) return;
      setHint("Adding the cover…");
      /* The Artifact's asset store is still the better home for a cover when it
         exists; IndexedDB is what makes the upload work everywhere else. */
      getAssets().then(function(a){
        if(a && a.upload){
          return a.upload(file).then(function(res){
            if(b.coverImage) imgDel(imgKey(b.id, "cover"));
            b.coverId = res.id; b.coverImage = false;
          });
        }
        return shrinkImage(file, 600, 900, 0.78).then(function(url){
          return imgPut(imgKey(b.id, "cover"), url).then(function(){
            b.coverImage = true; b.coverId = null;
          });
        });
      }).then(function(){
        saveBook(b); render(); refreshPreview();
        setHint(artHint(b));
        ensureRemove("uploadCover", "removeCover");
      }).catch(function(){
        setHint("That image didn't go through. Try again, or pick a smaller one.");
      });
    });
  });
  byId("uploadSpine").addEventListener("click", function(){
    pickFile(function(file){
      if(tooBig(file)) return;
      setHint("Adding the spine image…");
      shrinkImage(file, 200, 900, 0.8).then(function(url){
        return imgPut(imgKey(b.id, "spine"), url);
      }).then(function(){
        b.spineImage = true;
        saveBook(b); render();
        setHint(artHint(b));
        ensureRemove("uploadSpine", "removeSpine");
      }).catch(function(){
        setHint("That image didn't go through. Try again, or pick a smaller one.");
      });
    });
  });
  spread.addEventListener("click", function(e){
    var rmC = e.target.closest("#removeCover");
    if(rmC){
      var old = b.coverId;
      b.coverId = null;
      if(b.coverImage){ imgDel(imgKey(b.id, "cover")); b.coverImage = false; }
      saveBook(b); render(); refreshPreview();
      setHint(artHint(b));
      rmC.remove();
      if(old && assets && assets.delete) assets.delete(old).catch(function(){});
      return;
    }
    var rmS = e.target.closest("#removeSpine");
    if(rmS){
      imgDel(imgKey(b.id, "spine"));
      b.spineImage = false;
      saveBook(b); render();
      setHint(artHint(b));
      rmS.remove();
    }
  });

  /* ---- sections ----
     Only structural changes redraw the list; typing a label or a body must not,
     or the caret would jump out of the field on every keystroke. */
  function drawSections(){
    byId("sectionList").innerHTML = b.sections.map(function(sec, i){
      return sectionBlockHTML(sec, i, b.sections.length);
    }).join("");
  }
  function secIndex(id){
    for(var i = 0; i < b.sections.length; i++) if(b.sections[i].id === id) return i;
    return -1;
  }
  drawSections();

  spread.addEventListener("input", function(e){
    var body = e.target.closest("[data-sectext]");
    if(body){
      var i = secIndex(body.getAttribute("data-sectext"));
      if(i !== -1){ b.sections[i].text = body.value; saveBook(b); }
      return;
    }
    var lab = e.target.closest("[data-seclabel]");
    if(lab){
      var j = secIndex(lab.getAttribute("data-seclabel"));
      if(j !== -1){ b.sections[j].label = lab.textContent; saveBook(b); }
    }
  });
  spread.addEventListener("focusout", function(e){
    var lab = e.target.closest("[data-seclabel]");
    if(!lab) return;
    var i = secIndex(lab.getAttribute("data-seclabel"));
    if(i === -1) return;
    var name = lab.textContent.trim() || "Untitled section";
    b.sections[i].label = name;
    lab.textContent = name;
    var body = byId("sectionList").querySelector('[data-sectext="' + b.sections[i].id + '"]');
    if(body) body.placeholder = sectionPlaceholder(name);
    saveBook(b);
  });
  byId("sectionList").addEventListener("click", function(e){
    var mv = e.target.closest("[data-secmove]");
    if(mv){
      var i = secIndex(mv.getAttribute("data-sec-id"));
      var to = i + (mv.getAttribute("data-secmove") === "up" ? -1 : 1);
      if(i === -1 || to < 0 || to >= b.sections.length) return;
      var t = b.sections[i];
      b.sections[i] = b.sections[to];
      b.sections[to] = t;
      drawSections(); saveBook(b);
      return;
    }
    var del = e.target.closest("[data-secdel]");
    if(del){
      var k = secIndex(del.getAttribute("data-secdel"));
      if(k === -1) return;
      var sec = b.sections[k];
      if(sec.text && sec.text.trim() &&
         !confirm("Delete \u201C" + (sec.label || "Untitled section") + "\u201D and its notes? This can't be undone.")) return;
      b.sections.splice(k, 1);
      drawSections(); saveBook(b);
    }
  });
  byId("addSection").addEventListener("click", function(){
    var sec = {id:sectionId(), label:"New section", text:""};
    b.sections.push(sec);
    drawSections();
    saveBook(b);
    var lab = byId("sectionList").querySelector('[data-seclabel="' + sec.id + '"]');
    if(!lab) return;
    lab.focus();
    var range = document.createRange();
    range.selectNodeContents(lab);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    lab.scrollIntoView({block:"nearest"});
  });

  /* ---- favorite / delete / close ---- */
  byId("favBtn").addEventListener("click", function(){
    b.favorite = !b.favorite;
    this.classList.toggle("on", b.favorite);
    this.setAttribute("aria-pressed", String(!!b.favorite));
    saveBook(b); render();
  });
  byId("delBtn").addEventListener("click", function(){
    if(!confirm("Remove “" + (b.title || "this book") + "” from the shelf? This can't be undone.")) return;
    closeBook(); deleteBook(b.id);
  });
  byId("closeBtn").addEventListener("click", closeBook);
  ov.addEventListener("mousedown", function(e){ if(e.target === ov) closeBook(); });

  var first = isNew ? spread.querySelector('[data-f="title"]') : byId("closeBtn");
  if(first) first.focus();
  if(isNew && first){
    var range = document.createRange();
    range.selectNodeContents(first);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
  }
}

/* ---------------- export / import ---------------- */
function libraryPayload(images){
  return {
    format:"gilded-spines",
    version:2,
    exportedAt:new Date().toISOString(),
    statusDots:state.statusDots,
    defaultSections:state.defaultSections,
    shelfPlates:state.shelfPlates,
    groupLayout:state.groupLayout,
    defaultGroupLayout:state.defaultGroupLayout,
    categories:state.categories,
    books:list(),
    images:images || {}
  };
}
function bookCount(){ return Object.keys(state.books).length; }
/* Cover and spine images ride along as data URLs, or the file only restores
   half a shelf on the other device. */
function collectImages(){
  return IMGDB.keys().then(function(keys){
    return Promise.all((keys || []).map(function(k){
      return IMGDB.get(k).then(function(v){ return [k, v]; }, function(){ return null; });
    }));
  }, function(){ return []; }).then(function(pairs){
    var out = {};
    pairs.forEach(function(pair){
      if(pair && typeof pair[1] === "string") out[pair[0]] = pair[1];
    });
    return out;
  });
}
function exportLibrary(){
  setSave("Gathering the shelf…", "off");
  collectImages().then(function(images){ writeExport(images); }, function(){ writeExport({}); });
}
function writeExport(images){
  var json = JSON.stringify(libraryPayload(images), null, 2);
  var name = "gilded-spines-" + new Date().toISOString().slice(0,10) + ".json";
  var mb = json.length / (1024 * 1024);
  if(mb > 8 && !confirm(
      "This export is about " + mb.toFixed(1) + " MB — mostly cover and spine images.\n\n" +
      "Files this size get awkward to move between devices. Export it anyway?")){
    setSave("Export cancelled", "warn");
    return;
  }
  function viaBlob(){
    try {
      var url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
      setSave("Exported " + bookCount() + " books", "");
    } catch(e){
      setSave("Couldn't build the export file", "warn");
    }
  }
  if(window.claude && window.claude.use){
    window.claude.use("downloads").then(function(d){
      if(!d) return viaBlob();
      d.save({filename:name, data:json}).then(function(){
        setSave("Exported " + bookCount() + " books", "");
      }, function(){ setSave("Export cancelled", "warn"); });
    }, viaBlob);
  } else viaBlob();
}
function normalizeBook(raw){
  var b = {};
  Object.keys(raw || {}).forEach(function(k){ b[k] = raw[k]; });
  ["spineColor","spineColor2","coverColor","coverColor2","ribbonColor"].forEach(function(k){
    if(b[k] != null) b[k] = safeColor(b[k], null);
  });
  if(b.spineAngle != null) b.spineAngle = safeAngle(b.spineAngle, SPINE_ANGLE);
  if(b.coverAngle != null) b.coverAngle = safeAngle(b.coverAngle, COVER_ANGLE);
  if(typeof b.showStatusDot !== "boolean") delete b.showStatusDot;
  if(typeof b.order !== "number") delete b.order;
  b.coverImage = !!b.coverImage;
  b.spineImage = !!b.spineImage;
  if(FINISHES.indexOf(b.finish) === -1) delete b.finish;
  if(LETTERINGS.indexOf(b.lettering) === -1) delete b.lettering;
  if(typeof b.hubs !== "boolean") delete b.hubs;
  delete b.headbands;   /* dropped feature; ignored if an older file carries it */
  if(["spine","front","angle"].indexOf(b.display) === -1) b.display = "spine";
  b.title = String(b.title == null ? "Untitled" : b.title);
  b.author = String(b.author == null ? "" : b.author);
  b.id = String(b.id || slug(b.title + "-" + b.author));
  if(STATUS_ORDER.indexOf(b.status) === -1) b.status = "want";
  if(!b.ratings || typeof b.ratings !== "object") b.ratings = {};
  Object.keys(b.ratings).forEach(function(k){
    var v = parseFloat(b.ratings[k]);
    if(isNaN(v) || v <= 0 || v > 5) delete b.ratings[k];
    else b.ratings[k] = Math.round(v * 2) / 2;
  });
  b.favorite = !!b.favorite;
  if(typeof b.addedAt !== "number") b.addedAt = Date.now();
  migrateSections(b);
  return b;
}
function applyImport(payload, mode){
  var incoming = payload && payload.books;
  if(!Array.isArray(incoming) || !incoming.length){
    setSave("That file has no books in it", "warn");
    return;
  }
  /* Version 1 files carry no images; everything else is written into IndexedDB
     before the shelf redraws, so covers are there on the first paint. */
  var imgs = (payload.images && typeof payload.images === "object") ? payload.images : {};
  var keys = Object.keys(imgs).filter(function(k){
    return typeof imgs[k] === "string" && imgs[k].indexOf("data:image/") === 0;
  });
  setSave(keys.length ? "Restoring " + keys.length + " images…" : "Importing…", "off");
  Promise.all(keys.map(function(k){ return imgPut(k, imgs[k]).catch(function(){}); }))
    .then(function(){ finishImport(payload, incoming, mode); },
          function(){ finishImport(payload, incoming, mode); });
}
function finishImport(payload, incoming, mode){
  var seen = {};
  incoming.forEach(function(raw){
    var b = normalizeBook(raw);
    seen[b.id] = true;
    state.books[b.id] = b;
    saveBook(b);
  });
  if(mode === "replace"){
    Object.keys(state.books).forEach(function(id){
      if(!seen[id]){
        delete state.books[id];
        if(db) db.doc("books/" + id).delete().catch(function(){});
      }
    });
  }
  if(Array.isArray(payload.categories) && payload.categories.length){
    state.categories = payload.categories;
    buildSortOptions();
  }
  if(payload.statusDots !== undefined) state.statusDots = normStatusDots(payload.statusDots);
  if(payload.defaultSections !== undefined){
    state.defaultSections = normPrefsList(payload.defaultSections, DEFAULT_SECTIONS);
  }
  if(payload.shelfPlates !== undefined){
    state.shelfPlates = normPlates(payload.shelfPlates);
    byId("platesOn").checked = state.shelfPlates.show;
  }
  if(payload.groupLayout !== undefined) state.groupLayout = normLayoutMap(payload.groupLayout);
  if(payload.defaultGroupLayout !== undefined){
    state.defaultGroupLayout = normLayout(payload.defaultGroupLayout, "shelf");
  }
  savePrefs();
  render();
  setSave("Imported " + incoming.length + " books", "");
}
function importLibrary(){
  var input = byId("importFile");
  input.value = "";
  input.onchange = function(){
    var file = input.files && input.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var payload;
      try { payload = JSON.parse(reader.result); }
      catch(e){ setSave("That file isn't valid JSON", "warn"); return; }
      if(!payload || !Array.isArray(payload.books)){
        setSave("That doesn't look like a Gilded Spines export", "warn");
        return;
      }
      var replace = confirm(
        "Import " + payload.books.length + " books.\n\n" +
        "OK replaces your whole shelf with this file.\n" +
        "Cancel merges them in, keeping books that aren't in the file.\n\n" +
        "Either way, books with the same id are overwritten by the file."
      );
      applyImport(payload, replace ? "replace" : "merge");
    };
    reader.onerror = function(){ setSave("Couldn't read that file", "warn"); };
    reader.readAsText(file);
  };
  input.click();
}

/* ---------------- sort options ---------------- */
function buildSortOptions(){
  var sel = byId("sortBy"), keep = state.sortBy;
  var opts = [
    ["series","Series &amp; volume"],["title","Title"],["author","Author"],
    ["number","Volume number"],["status","Shelf"],["favorite","Favorites first"],
    ["added","Date added"],["progress","Progress"],["custom","Custom (arranged)"]
  ].map(function(o){ return '<option value="' + o[0] + '">' + o[1] + "</option>"; });
  state.categories.forEach(function(c){
    opts.push('<option value="r:' + esc(c.key) + '">Rating &middot; ' + esc(c.label) + "</option>");
  });
  sel.innerHTML = opts.join("");
  sel.value = keep;
  if(sel.value !== keep){ state.sortBy = "series"; sel.value = "series"; }
}

/* ---------------- selection ---------------- */
function selectedIds(){
  return Object.keys(state.selection).filter(function(id){ return state.books[id]; });
}
function selectedBooks(){
  return selectedIds().map(function(id){ return state.books[id]; }).sort(cmp);
}
function clearSelection(){ state.selection = {}; }
function drawSelectBar(){
  var bar = byId("selectBar");
  bar.hidden = !state.selecting;
  if(!state.selecting) return;
  var n = selectedIds().length;
  byId("selCount").textContent = n ? (n + (n === 1 ? " selected" : " selected")) : "Nothing selected";
  byId("bulkBtn").disabled = !n;
  byId("bulkBtn").style.opacity = n ? "" : ".45";
  byId("deleteBtn").disabled = !n;
  byId("deleteBtn").style.opacity = n ? "" : ".45";
}
function setSelecting(on){
  state.selecting = !!on;
  if(state.selecting && state.arranging) setArranging(false);
  if(!state.selecting) clearSelection();
  byId("selectBtn").setAttribute("aria-pressed", String(state.selecting));
  document.body.classList.toggle("selecting", state.selecting);
  drawSelectBar();
  render();
}
function setArranging(on){
  state.arranging = !!on;
  if(state.arranging && state.selecting) setSelecting(false);
  byId("arrangeBtn").setAttribute("aria-pressed", String(state.arranging));
  document.body.classList.toggle("arranging", state.arranging);
  if(state.arranging) useCustomOrder(); else endDrag(false);
  updateMoveSeg();
  render();
}
function quickSelect(which){
  var all = list();
  if(which === "none"){ clearSelection(); }
  else if(which === "all"){ all.forEach(function(b){ state.selection[b.id] = true; }); }
  else if(which === "fav"){ all.forEach(function(b){ if(b.favorite) state.selection[b.id] = true; }); }
  else if(which === "shelf"){ all.filter(matches).forEach(function(b){ state.selection[b.id] = true; }); }
  else if(which === "invert"){
    var next = {};
    all.forEach(function(b){ if(!state.selection[b.id]) next[b.id] = true; });
    state.selection = next;
  }
  drawSelectBar();
  render();
}

/* ---------------- one level of undo ---------------- */
var undoState = null, undoTimer = null;
function clearUndo(){
  undoState = null;
  clearTimeout(undoTimer);
  var u = byId("undoBtn");
  if(u) u.hidden = true;
}
function offerUndo(run, text){
  clearTimeout(undoTimer);
  undoState = run;
  paintSave(text, "");
  byId("undoBtn").hidden = false;
  undoTimer = setTimeout(function(){ clearUndo(); }, 30000);
}
function runUndo(){
  if(!undoState) return;
  var run = undoState;
  clearUndo();
  run();
}
function undoFields(snap){
  return function(){
    snap.forEach(function(o){
      var b = state.books[o.id];
      if(!b) return;
      Object.keys(o).forEach(function(f){
        if(f === "id") return;
        if(o[f] === undefined) delete b[f]; else b[f] = o[f];
      });
      saveBook(b);
    });
    render();
    paintSaveSticky("Reverted " + snap.length + " books", "");
  };
}

/* ---------------- batch delete ---------------- */
function deleteSelected(){
  var books = selectedBooks();
  if(!books.length) return;
  if(books.length === 1){
    if(!confirm("Remove \u201C" + (books[0].title || "this book") + "\u201D from the shelf? This can't be undone.")) return;
  } else {
    var shown = books.slice(0, 5).map(function(b){ return "\u2022 " + (b.title || "Untitled"); }).join("\n");
    var more = books.length > 5 ? "\n\u2022 and " + (books.length - 5) + " more" : "";
    var typed = prompt(
      "Delete " + books.length + " books from the shelf?\n\n" + shown + more +

    r = row[i].getBoundingClientRect();
